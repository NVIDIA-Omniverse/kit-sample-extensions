########################################################################################################################
# Example:
########################################################################################################################

#
# [[dependency]]                           # Toml way to define array of objects.
# python = "../_build/target-deps/python"  # Path to python used to install. Absolute or relative to this config.
# packages = ["numpy"]                     # Array of packages to install, they all will be passed directly to pip.
# target = "../_build/target-deps/numpy"   # Folder to install into.   Absolute or relative to this config.
# platforms = ["windows-x86_64"]           # Platform(s) to filter, default is ["*"].
# download_only = true                     # Do pip download instead of install, gets a whl file that can be installed later.

# !!!
# IMPORTANT: If you change this config cleanup target folder. Script check that it already exists and does nothing.


# Options.
# Various options are available that are passed through pip during the installation.

# download_only: Only download the pip package, do not install it.
# install_dependencies: When set to False, dependencies of a pip package will not be downloaded or installed
# append_to_install_folder: When set to true and the target directory already exists, these packages will be appended to the existing folder.
# build_isolated: Sets `--isolated` for pip install when installing. This means that environment variables and user settings will be ignored.
# add_python_to_lib_path: Will set --global-options to include Python's lib and include folders when running the pip install.
#    Useful when a python pip package has a C extension that needs to bind to Python. Setting this to true will set build_isolated to False.

########################################################################################################################
# Dependencies:
########################################################################################################################


# NOTE - For any new packages added to this list, please make sure that the license is compatible with Omniverse (i.e. avoid GPL/LGPL) and
# that a SWIPAT bug report is filed for legal to validate if there is no existing ticket.
# Build tools stay separate and do not pull runtime dependencies.
# Resolve all runtime package pins together in the next block; sequential overlays
# previously installed conflicting AWS SDK versions and repeated aiohttp/urllib3.
[[dependency]]
python = "../_build/target-deps/python"
packages = [
    "setuptools==80.10.2",
    "cython==3.0.9",
]
target = "${root}/_build/target-deps/pip_prebundle_services"
platforms = ["*"]
download_only = false
install_dependencies = false
append_to_install_folder = true
gather_licenses_path = "../_build/PACKAGE-LICENSES/PIP-prebundled-LICENSES.txt"
extra_args = ["--index-url", "https://pypi.org/simple"]

# For many other pip packages used by default we install them in `pip_prebundle` folder to make available without need to install immediately.

# NOTE - For any new packages added to this list, please make sure that the license is compatible with Omniverse (i.e. avoid GPL/LGPL) and
# that a SWIPAT bug report is filed for legal to validate if there is no existing ticket.
[[dependency]]
python = "${root}/_build/target-deps/python"
packages = [
    "aioboto3==15.5.0",                # OSRB: https://nvbugs/4895046
    "aiobotocore==2.25.1",             # Required by aioboto3 15.5.0; OSRB: https://nvbugs/4576936
    "multidict==6.7.0",                # OSRB: https://nvbugs/5082113
    "prometheus_client==0.12.0",
    "aiokafka==0.9.0",
    "databases==0.7.0",
    "asyncpg==0.30.0",
    "aiomysql==0.3.0",
    "aiosqlite==0.19.0",
    # Specifying typing_extensions version explicitely here. It is a dependency of asyncpg.
    # it has a Python license which requires special approval from the SWIPAT team.
    # We already have this approval with Kit for 3.7.4.3.
    "typing_extensions==4.14.1",
    "pyperclip==1.8.0",
    "watchdog==4.0.0",
    # Used by aioboto3
    "aioitertools==0.8.0",
    "boto3==1.40.61",
    "wrapt==1.17.2",
    "aioredis==2.0.0",
    "pynvml==11.0.0",                   # NVIDIA owned library.
    # Used by aiohttp:
    "aiohttp==3.14.3",
    "aiosignal==1.4.0",
    "opensearch-py==2.8.0",
    "aiodocker==0.21.0",
    "zeroconf==0.43.0",
    "ifaddr==0.2.0",

    # # Used by Correlation ID generator Middleware:
    # "asgi_correlation_id==4.2.0",
    "botocore==1.40.61",
    # Used by omniverse_authorization_client
    "pyyaml==6.0.1",
    "requests==2.33.0",
    "cryptography==48.0.1",
    # Used by kubernetes client
    "kubernetes_asyncio==24.2.3",
    # Not used at the moment. Tracing facility needs a rewrite.
    #"opentracing==2.4.0",
    #"contextvars==2.4",
    #"jaeger-client==4.4.0",
    "redis==5.0.5",
    "urllib3>=2.8.0",                    # CVE-2025-66471/66418, CVE-2026-97687/97689
]
target = "${root}/_build/target-deps/pip_prebundle_services"
platforms = ["*"]
download_only = false
append_to_install_folder = true
gather_licenses_path = "../_build/PACKAGE-LICENSES/PIP-prebundled-LICENSES.txt"
extra_args = ["--index-url", "https://pypi.org/simple"]

# [linux] pyjwt dependency used by omni.auth client. [crypto] is required in order for jwt decode to work with rs216 algorithm.
[[dependency]]
python = "${root}/_build/target-deps/python"
packages = [
    # Used by omniverse_authorization_client
    "pyjwt[crypto]==2.13.0",
]
target = "${root}/_build/target-deps/pip_prebundle_services"
platforms = ["linux-*"]
download_only = false
append_to_install_folder = true
gather_licenses_path = "../_build/PACKAGE-LICENSES/PIP-prebundled-LICENSES.txt"
extra_args = ["--index-url", "https://pypi.org/simple"]

# [windows] pyjwt dependency used by omni.auth client. omni.auth client wrapper extension will not work in Windows since [crypo] is required in order to jwt decode to work with rs216 algorithm.
[[dependency]]
python = "${root}/_build/target-deps/python"
packages = [
    # Used by omniverse_authorization_client
    "pyjwt==2.13.0",
]
target = "${root}/_build/target-deps/pip_prebundle_services"
platforms = ["windows-*"]
download_only = false
append_to_install_folder = true
gather_licenses_path = "../_build/PACKAGE-LICENSES/PIP-prebundled-LICENSES.txt"
extra_args = ["--index-url", "https://pypi.org/simple"]
