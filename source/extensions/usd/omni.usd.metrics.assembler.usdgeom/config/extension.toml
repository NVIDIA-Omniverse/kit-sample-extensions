[package]
version = "0.1.0"
title = "Metrics Assembler UsdGeom Rules"
description = "Custom Metrics Assembler resolve rules for UsdGeom (camera) scene-unit attributes."
authors = ["NVIDIA"]
category = "USD"
repository = "https://github.com/NVIDIA-Omniverse/kit-sample-extensions"
readme = "docs/README.md"
keywords = ["usd", "camera", "metrics"]
changelog = "docs/CHANGELOG.md"
support_level = "Core"
icon = "data/icon.png"
preview_image = "data/preview.png"

[package.writeTarget]
kit = true
python = true
usd = true

[dependencies]
"omni.usd.metrics.assembler" = {}

[[python.module]]
name = "omni.metrics.assembler.usdgeom"

[[test]]
dependencies = []
args = [
    "--no-window",
    "--/app/asyncRendering=false",
    "--/app/font/file='${fonts}/OpenSans-SemiBold.ttf'",
    "--/app/font/size=16",
]
