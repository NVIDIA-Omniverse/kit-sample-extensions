[package]
# Semantic Versioning is used: https://semver.org/
version = "1.2.0"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["Jeff Hanna", "Bob White"]

# The title and description fields are primarly for displaying extension info in UI
title = "USD Explorer Welcome Window"
description="USD Explorer startup welcome window."

# URL of the extension source repository.
repository="https://github.com/NVIDIA-Omniverse/kit-sample-extensions"

# Keywords for the extension
keywords = ["usd explorer", "welcome"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.rst"

category = "USD Explorer"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.svg"

[package.target]
kit = ["107.3"]

[dependencies]
"omni.ui" = {}
"omni.client" = {}
"omni.kit.actions.core" = {}
"omni.kit.usd.layers" = {optional = true}
"omni.kit.widgets.custom" = {}
"omni.kit.window.file" = {}
"omni.kit.viewport.utility" = {}
"omni.kit.viewport.navigation.core" = {}
"omni.kit.window.about" = {}
"omni.kit.viewport.menubar.bottom" = {}
"omni.usd" = {}

# this handles recent files
"omni.kit.menu.file" = {}

[settings]
exts."omni.kit.usd_explorer.window.welcome".docsURL = "explorer" # NOTE: this string will be appended to https://docs.omniverse.nvidia.com/

# Main python module this extension provides, it will be publicly available as "import omni.kit.usd_explorer.window.welcome".
[[python.module]]
name = "omni.kit.usd_explorer.window.welcome"

[[test]]
dependencies = [
    "omni.kit.ui_test",
]

args = [
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--no-window",
    "--reset-user",
]

stdoutFailPatterns.exclude = [
    "*[Error] [carb] Client omni.ui Failed to acquire interface [omni::kit::renderer::IGpuFoundation v0.2] while unloading all plugins*",
]
