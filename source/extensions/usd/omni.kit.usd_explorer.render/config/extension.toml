[package]
# Semantic Versionning is used: https://semver.org/
version = "1.1.1"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["Jeff Hanna"]

# The title and description fields are primarly for displaying extension info in UI
title = "USD Explorer render preset"
description="USD Explorer render preset"

# URL of the extension source repository.
repository="https://github.com/NVIDIA-Omniverse/kit-sample-extensions"

# Keywords for the extension
keywords = ["usd explorer", "render", "preset"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.rst"

category = "USD Explorer"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.svg"

[package.target]
kit = ["107.3"]

[dependencies]
"omni.kit.usd_explorer.tooltip" = {}
"omni.kit.widgets.custom" = {}
"omni.kit.viewport.utility" = {}
# Directly imported, previously only resolved transitively.
"omni.kit.menu.utils" = {}

# Main python module this extension provides, it will be publicly available as "import omni.kit.usd_explorer.render".
[[python.module]]
name = "omni.kit.usd_explorer.render"

[settings]
renderer.camera_move_state = false
app.renderer.camera_test = 30

[[test]]
# OMPE-65241: do NOT add "omni.app.dev" (or any other app) here. It pulled in ~246
# extensions and intermittently hung the Windows CI runners.
args = [
    # "--/app/fastShutdown=1",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/file/ignoreUnsavedOnExit=true",
    # "--no-window"
]

stdoutFailPatterns.exclude = [
    # "*<class 'omni.kit.window.tests.Extension'>: extension object is still alive*", # Leak
]
