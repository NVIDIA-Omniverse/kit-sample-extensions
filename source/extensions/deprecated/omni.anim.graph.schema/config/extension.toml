[core]
reloadable = false
# Load at the start, load all schemas with order -100 (with order -1000 the USD libs are loaded)
order = -100

[package]
readme = "docs/README.md"
changelog = "docs/CHANGELOG.md"
icon = "data/icon.png"
# Use the Extension Manager category fallback as the preview for this nonvisual schema.
preview_image = "data/icon.png"
version = "110.4.0"
category = "Animation"
title = "USD Animation Graph schema"
description="USD Animation Graph schema"
authors = ["NVIDIA"]
keywords = ["animation", "animgraph", "anim", "graph", "skeleton", "skeletal", "usd", "schema"]

[dependencies]
"omni.usd.libs" = {}

[deprecation]
warning = "Extension deprecated since Kit 110.1."

[[python.module]]
name = "omni.anim.graph.schema"

[package.writeTarget]
kit = true
usd = true

[[test]]
waiver = "USD Schema, tested externally"
