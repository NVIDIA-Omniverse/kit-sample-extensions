[package]
title = "Graph Editor Example"
description = "Review and Learn how to build a graph editor and Graph Model"
version = "1.1.3"
authors = ["Victor Yudin, Min Jiang"]
repository = "https://github.com/NVIDIA-Omniverse/kit-sample-extensions"
keywords = ["graph", "example", "editor"]
changelog = "docs/CHANGELOG.md"
preview_image = "data/preview.png"
readme = "docs/README.md"
category = "Kit"
icon = "icons/icon.svg"

[dependencies]
"omni.ui" = {}
"omni.kit.graph.editor.core" = {}
"omni.kit.window.quicksearch" = {optional=true}
"omni.kit.window.filepicker" = {optional=true}
"omni.kit.window.popup_dialog" = {optional=true}
"omni.kit.graph.delegate.default" = {}
"omni.kit.graph.delegate.modern" = {}
"omni.kit.graph.delegate.neo" = {}
"omni.kit.menu.utils" = {}

[[python.module]]
name = "omni.kit.graph.editor.example"

[[test]]
dependencies = [
    "omni.kit.mainwindow",
    "omni.kit.window.filepicker",
    "omni.kit.ui_test",
]

args = [
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--no-window"
]

stdoutFailPatterns.exclude = [
    "*Failed to load texture*",
]

[deprecation]
warning = "Extension deprecated. Planned for removal in Kit 111. This graph-editor example is being retired; the graph editor core remains available."
