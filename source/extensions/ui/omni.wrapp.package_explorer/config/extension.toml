[package]
# Semantic Versioning is used: https://semver.org/
version = "2.4.5"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["Jeffrey Qiu", "John Kosnik", "Attila Szabo", "Wayne Lai"]

# The title and description fields are primarly for displaying extension info in UI
title = "Package Explorer"
description="A browser for WRAPP Packages"

# URL of the extension source repository.
repository="https://github.com/NVIDIA-Omniverse/kit-sample-extensions"

# Keywords for the extension
keywords = ['browser', 'asset', 'wrapp', "explorer"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

category = "Rendering"
readme  = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.svg"
feature = true

[dependencies]
"omni.kit.pip_archive" = {}
"omni.kit.browser.core" = { version = ">=2.3.13" }
"omni.kit.browser.folder.core" = { version = ">=1.10.4" }
"omni.kit.commands" = {}
"omni.kit.menu.utils" = {}
"omni.usd" = {}
"omni.kit.viewport.utility" = {}
"omni.kit.window.property" = {}
"omni.kit.widget.searchfield" = {}
"omni.kit.viewport.window" = {}
"omni.kit.usd.layers" = { optional=true }
"omni.kit.notification_manager" = { optional=true }
"omni.cip.workspace" = { optional=true }

[[python.module]]
path = "pip_prebundle_package_explorer"

# Main python module this extension provides, it will be publicly available as "import omni.wrapp.package_explorer".
[[python.module]]
name = "omni.wrapp.package_explorer"

[settings.exts."omni.wrapp.package_explorer"]
# The list of asset root folders to be browsed.
default_folders = []
always_show_default_folders = false

[[trigger]]
menu.name = "Window/Browsers/Package Explorer"
menu.window = "Package Explorer"

[[test]]
args = [
    "--no-window",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/menu/legacy_mode=false",
]

stdoutFailPatterns.exclude = [
    "*[Error] * No auth information provided for server*",
    "*[Error] [omni.kit.browser.folder.core.models.folder_browser_model] Invalid URL: *"
]

[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]
