[package]
# Semantic Versionning is used: https://semver.org/
version = "2.4.0"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["Jeffrey Qiu"]

# The title and description fields are primarly for displaying extension info in UI
title = "Browser Core APIs"
description="extension for browser core APIs."

# URL of the extension source repository.
repository="https://github.com/NVIDIA-Omniverse/kit-sample-extensions"

# Keywords for the extension
keywords = ['browser', 'core', 'api']

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

category = "Rendering"
readme  = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.png"


[dependencies]
"omni.ui" = {}
"omni.ui.scene" = {}
"omni.kit.widget.zoombar" = {}
"omni.kit.widget.searchfield" = {}
"omni.kit.viewport.window" = {optional=true}

# Main python module this extension provides, it will be publicly available as "import omni.browser.core".
[[python.module]]
name = "omni.kit.browser.core"

[settings.exts."omni.kit.browser.core"]
# Milliseconds spent building detail tiles before yielding a frame. Building every new tile in one
# go held the main thread for 100 s on a large scan.
thumbnail_view.build_budget_ms = 8

[settings]

[[test]]
dependencies = [
    "omni.kit.ui_test",
]

args = [
    "--no-window",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/renderer/enabled=ovrtx",
    "--/renderer/active=ovrtx",
    "--/renderer/multiGpu/enabled=false",
    "--/renderer/multiGpu/autoEnable=false",
    "--/renderer/multiGpu/maxGpuCount=1",
]

[documentation]
pages = ["docs/Overview.md", "docs/SETTINGS.md", "docs/USAGE_PYTHON.md", "docs/CHANGELOG.md"]
