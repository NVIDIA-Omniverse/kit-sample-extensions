[package]
title = "Omni.UI Sample Gestures for omni.ui.Window"
version = "1.0.0"  # Semantic Versioning is used: https://semver.org/
description = "Sample extension demonstrating gesture interactions within omni.ui.Window with click, hover, and drag capabilities."
category = "Example"  # How to categorize this in the Extension Manager
changelog = "docs/CHANGELOG.md"
icon = "data/icon.png"  # Icon to show in the Extension Manager
keywords = ["kit", "example", "extension"]  # Search keywords for the Extension Manager
preview_image = "data/preview.png"  # Preview to show in the Extension Manager
readme  = "docs/README.md"  # Path (relative to the root) or content of readme markdown file for UI


[dependencies]
"omni.ui" = {}
"omni.ui.scene" = {}

[[python.module]]  # Main python module this extension provides, it will be publicly available as "import omni.sample.gesture_window"
name = "omni.sample.gesture_window"


[documentation]
pages = [
    "docs/CHANGELOG.md",
]


[[test]]
dependencies = [
    "omni.kit.ui_test" # UI testing extension

]

args = [
]