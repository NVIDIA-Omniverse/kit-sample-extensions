[package]
# Semantic Versionning is used: https://semver.org/
version = "1.3.8"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["Jeffrey Qiu"]

# The title and description fields are primarly for displaying extension info in UI
title = "Playlist Core"
description = "Core API for playlist"

# URL of the extension source repository.
repository = "https://github.com/NVIDIA-Omniverse/kit-sample-extensions"

# Keywords for the extension
keywords = ["kit", "ui", "API", "playlist"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog = "docs/CHANGELOG.md"

# Path (relative to the root) or content of readme markdown file for UI.
readme = "docs/README.md"

# Preview image and icon. Folder named "data" automatically goes in git lfs (see .gitattributes file).
# Preview image is shown in "Overview" of Extensions window. Screenshot of an extension might be a good preview image.
preview_image = "icons/preview.png"

# Icon is shown in Extensions window, it is recommended to be square, of size 256x256.
icon = "icons/Camera.png"

category = "Other"

[dependencies]
"omni.kit.viewport.utility" = {}
"omni.kit.widgets.custom" = {}
# "omni.anim.curve" = {}

# Main python module this extension provides.
[[python.module]]
name = "omni.kit.playlist.core"

[settings.exts."omni.kit.playlist.core"]
smooth_with_time_sampling = false

[documentation.pages]
"Overview" = "docs/overview.md"
"ApiOverview" = "docs/Overview.md"
"Settings" = "docs/SETTINGS.md"
"UsagePython" = "docs/USAGE_PYTHON.md"
"Changelog" = "docs/CHANGELOG.md"

[[test]]
dependencies = [
    "omni.kit.test_suite.helpers",
    "omni.kit.viewport.window",
    "omni.kit.widget.stage",
]

args = [
    "--/renderer/enabled=ovrtx",
    "--/renderer/active=ovrtx",
    "--/app/window/width=800",
    "--/app/window/height=800",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/exts/omni.kit.playlist.core/smooth_with_time_sampling=true",
    "--no-window",
]

stdoutFailPatterns.exclude = [
    "*Hot key already registered:*",
    "*Failed to acquire interface [omni::kit::renderer::IGpuFoundation v0.2]*",                       # Leak
    "*[Error] [omni.kit.prim.icon.extension] Could not register Prim Icon for any Viewport backend*",
    "*IToken not found when initializing omni.anim.curve.AnimCurve*",
]
