[package]
version = "1.1.5"
authors = ["Bob White"]
title = "No Code UI"
description="Bundle extension for Authoring No Code UI / data2ui"
readme  = "docs/README.md"
repository="https://github.com/NVIDIA-Omniverse/kit-sample-extensions"
category = "UI"
keywords = ["kit", "datadriven", "codeless", "ui", "nocode", "no code", "no", "code"]
changelog="docs/CHANGELOG.md"
preview_image = "data/preview.png"
icon = "data/icon.png"
waiver = "Bundle extension for No Code UI / data2ui"
support_level = "Sample"

[package.target]
kit = ["107.0"]

[package.writeTarget]
kit = true

[dependencies]
"omni.no_code_ui.bundle" = {exact=true, version="1.1.5"}
"omni.kit.menu.utils" = {}
"omni.kit.context_menu" = {}
"omni.kit.property.usd" = {}
"omni.kit.window.property" = {}
"omni.kit.widget.highlight_label" = {}
"omni.kit.widget.searchfield" = {}
"omni.kit.widget.stage" = {}
"omni.kit.widget.stage_icons" = {}
"omni.kit.actions.window" = {} # Used for Callable properties search field

[settings]
exts."omni.no_code_ui.authoring".enabled = true

[documentation.pages]
"Overview" = "docs/overview.md"
"Changelog" = "docs/CHANGELOG.md"

[[test]]
waiver = "Bundle extension"
