[package]
title = "Omni.UI Sample Gestures for Viewport"
version = "1.1.0"  # Semantic Versioning is used: https://semver.org/
description = "Sample extension demonstrating gesture interactions in the Omniverse viewport using omni.ui.scene framework."
category = "Example"  # How to categorize this in the Extension Manager
changelog = "docs/CHANGELOG.md"
icon = "data/icon.png"  # Icon to show in the Extension Manager
keywords = ["kit", "example", "extension"]  # Search keywords for the Extension Manager
preview_image = "data/preview.png"  # Preview to show in the Extension Manager
readme  = "docs/README.md"  # Path (relative to the root) or content of readme markdown file for UI


[dependencies]
"omni.kit.uiapp" = {}
"omni.ui.scene" = {}
"omni.ui" = {}
"omni.kit.viewport.registry" = {}
"omni.usd" = {}

[settings]


[[python.module]]  # Main python module this extension provides, it will be publicly available as "import omni.sample.gesture_viewport"
name = "omni.sample.gesture_viewport"


[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]

[[test]]
args = [
    "--/renderer/enabled=ovrtx",
    "--/renderer/active=ovrtx",
    "--/app/viewport/forceHideFps=true",
    "--/app/viewport/grid/enabled=false",
    "--/app/viewport/defaults/guide/grid/visible=false",
    "--reset-user"
]
dependencies = [
    "omni.kit.hydra_texture-ovrtx",
    "omni.kit.ui_test",
]