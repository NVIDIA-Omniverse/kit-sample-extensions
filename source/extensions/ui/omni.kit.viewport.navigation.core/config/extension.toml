[package]
# Semantic Versionning is used: https://semver.org/
version = "1.0.31"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["Ning Li"]

# The title and description fields are primarly for displaying extension info in UI
title = "Viewport navigation bar"
description="Provide the viewport menu bar at bottom."

# URL of the extension source repository.
repository="https://github.com/NVIDIA-Omniverse/kit-sample-extensions"

# Keywords for the extension
keywords = ['viewport', 'menubar', 'bottom']

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.rst"

category = "Kit::exts"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.svg"

[dependencies]
"omni.kit.viewport.menubar.core" = {}

[[python.module]]
name = "omni.kit.viewport.navigation.core"

[settings]
exts."omni.kit.viewport.navigation.core".barName = "Viewport Navigation Menubar"
exts."omni.kit.viewport.navigation.core".isVisible = true
exts."omni.kit.viewport.navigation.core".bottom_offset = 84
exts."omni.kit.viewport.navigation.core".bottom_spacing = 10
exts."omni.kit.viewport.navigation.core".spacing = 5
exts."omni.kit.viewport.navigation.core".tips_order = 1000
exts."omni.kit.viewport.navigation.core".tips_visible = true
exts."omni.kit.viewport.navigation.core".is_large = true
exts."omni.kit.viewport.navigation.core".large_size = 43
exts."omni.kit.viewport.navigation.core".small_size = 35
exts."omni.kit.viewport.navigation.core".activeOperation = ""
exts."omni.kit.viewport.navigation.core".next_operation = "none|orbit,orbit|teleport,teleport|orbit"

[[test]]
pythonTests.exclude = ["*test_extensions_api_md_is_uptodate"]
dependencies = [
    "omni.kit.hotkeys.core",
    "omni.kit.viewport.window",
    "omni.kit.ui_test",
    "omni.kit.viewport.menubar.display",
]
args = [
    "--/app/window/width=800",
    "--/app/window/height=300",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/exts/omni.kit.viewport.window/startup/windowName=Viewport",
    "--/persistent/app/viewport/displayOptions=1568",
    "--no-window",
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/app/fastShutdown=1",
]

stdoutFailPatterns.exclude = [
    "*[gpu.foundation.plugin]*rtx/utils/BufferTexture.comp.hlsl*",
    "*[gpu.foundation.plugin] PsoCompute::createPipeline and shader loading failed.*",
]
