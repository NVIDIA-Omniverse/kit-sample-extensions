[package]
# Semantic Versioning is used: https://semver.org/
version = "104.2.16"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["Jeffrey Qiu"]

# The title and description fields are primarly for displaying extension info in UI
title = "Waypoint in Viewport Menu Bar"
description="Adds a variety of waypoint settings"

# URL of the extension source repository.
repository="https://github.com/NVIDIA-Omniverse/kit-sample-extensions"

# Keywords for the extension
keywords = ["kit", "ui", "menu", "viewport", "waypoint"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

# Path (relative to the root) or content of readme markdown file for UI.
readme  = "docs/README.md"

# Icon is shown in Extensions window, it is recommended to be square, of size 256x256.
icon = "data/icons/Waypoint.svg"
preview_image = "data/icons/Waypoint.svg"

category = "Internal"

[dependencies]
"omni.kit.viewport.menubar.core" = {}
"omni.kit.waypoint.core" = {}
"omni.kit.viewport.utility" = {}
"omni.kit.waypoint.playlist" = {}

# Main python module this extension provides, it will be publicly available as "import omni.kit.viewport.menubar.display".
[[python.module]]
name = "omni.kit.viewport.menubar.waypoint"

[settings]
exts."omni.kit.viewport.menubar.waypoint".visible = true
exts."omni.kit.viewport.menubar.waypoint".order = 300
exts."omni.kit.waypoint.core".visible_startup = false

[settings.app.waypoint.playlist]
next.enabled = true
previous.enabled = true
play.enabled = true
playing = false

[[test]]
dependencies = [
    "omni.kit.viewport.window",
    "omni.kit.ui_test",
    "omni.kit.viewport.menubar.display",
]
args = [
    "--/app/window/width=800",
    "--/app/window/height=300",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/exts/omni.kit.viewport.window/startup/windowName=Viewport",
    "--no-window",
    "--/app/file/ignoreUnsavedOnExit=true",
]
