[package]
# Semantic Versionning is used: https://semver.org/
version = "1.0.7"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["Greg Amato"]

# The title and description fields are primarly for displaying extension info in UI
title = "Viewport bottom menubar"
description="Provide the measure button and functon in navigation bar."

# URL of the extension source repository.
repository="https://github.com/NVIDIA-Omniverse/kit-sample-extensions"

# Keywords for the extension
keywords = ['navigation', 'bar', 'measure']

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.rst"

category = "Kit::exts"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.svg"

[dependencies]
"omni.kit.viewport.navigation.core" = {}
"omni.kit.tool.measure" = {}

# Main python module this extension provides, it will be publicly available as "import omni.kit.viewport.navigation.measure".
[[python.module]]
name = "omni.kit.viewport.navigation.measure"

[settings]
exts."omni.kit.viewport.navigation.measure".order= -850
exts."omni.kit.viewport.navigation.measure".visible= true
# Opt-in: when true, toggling the Measure panel also shows/hides completed
# measurements in the viewport. Off by default to preserve panel-only behavior.
exts."omni.kit.viewport.navigation.measure".toggle_measurement_visibility= false

[[test]]
dependencies = [
    "omni.kit.ui_test",
    # "omni.rtx.shadercache.vulkan",  # legacy RTX shader cache; absent from Kit 111 (OVRTX)
]

"filter:platform"."windows-x86_64".dependencies = [
    # fix [Error][gpu.foundation.plugin] Cannot load shader file
    "omni.kit.ui_test",
    # "omni.rtx.shadercache.vulkan",  # legacy RTX shader cache; absent from Kit 111 (OVRTX)
    # "omni.rtx.shadercache.d3d12",  # legacy RTX shader cache; absent from Kit 111 (OVRTX)
]

args = [
    "--/app/window/width=800",
    "--/app/window/height=300",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/exts/omni.kit.viewport.window/startup/windowName=Viewport",
    "--/persistent/app/viewport/displayOptions=1568",
    "--no-window",
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/app/fastShutdown=1",
]

stdoutFailPatterns.exclude = [
    "*[gpu.foundation.plugin]*rtx/utils/BufferTexture.comp.hlsl*",
    "*[gpu.foundation.plugin] PsoCompute::createPipeline and shader loading failed.*",
]
