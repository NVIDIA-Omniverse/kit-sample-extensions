[package]
version = "1.0.21"
authors = ["NVIDIA"]
repository = "https://github.com/NVIDIA-Omniverse/kit-sample-extensions"
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
keywords = ["variant", "stage", "column", "variantset"]
title = "Stage Column Variant"
description = "Be able to change variant(s) from the 'stage widget'"
preview_image = "data/preview.png"
icon = "data/reference.svg"
category = "other"
writeTarget.kit = true

[ui]
name = "Stage Column Variant"

[dependencies]
"omni.kit.commands" = {}
"omni.kit.widget.stage" = {}
"omni.ui" = {}

[[python.module]]
name = "omni.kit.stage_column.variant"

[documentation]
pages = [
    "docs/CHANGELOG.md",
]

[[test]]
args = [
    "--/app/file/ignoreUnsavedStage=true",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--no-window",
]

stdoutFailPatterns.exclude = [
    "*[omni.ui.python] Tried to call pure virtual function*",
]

dependencies = [
    "omni.kit.mainwindow",
    "omni.kit.ui_test",
    "omni.kit.test_suite.helpers",
    "omni.kit.viewport.window",
    "omni.kit.window.stage",
    "omni.kit.property.usd", # for SelectVariantPrimCommand
]
