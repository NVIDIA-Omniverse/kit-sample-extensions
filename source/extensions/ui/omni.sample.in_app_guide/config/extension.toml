[package]
title = "In-App Guide"
version = "1.2.0"  # Semantic Versioning is used: https://semver.org/
description = "The simplest python extension example. Use it as a starting point for your extensions."
category = "Example"  # How to categorize this in the Extension Manager
changelog = "docs/CHANGELOG.md"
icon = "data/icon.png"  # Icon to show in the Extension Manager
keywords = ["kit", "example", "extension"]  # Search keywords for the Extension Manager
preview_image = "data/preview.png"  # Preview to show in the Extension Manager
readme  = "docs/README.md"  # Path (relative to the root) or content of readme markdown file for UI



[dependencies]
"omni.ui" = {} # UI framework
"omni.ui_query" = {} # Features for querying about UI elements
"omni.kit.ui_test" = {} # Features for simulating user interaction
"omni.kit.menu.utils" = {} # Menu capabilities
"omni.kit.actions.core" = {} # Actions for menus


[settings]


[[python.module]]  # Main python module this extension provides, it will be publicly available as "import omni.sample.in_app_guide"
name = "omni.sample.in_app_guide"


[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]


[[test]]
timeout = 600
dependencies = [
    "omni.kit.mainwindow",
    "omni.kit.menu.file",
    "omni.kit.menu.create",
    "omni.kit.hydra_texture-ovrtx",
    "omni.kit.viewport.bundle",
    "omni.kit.property.bundle",
    "omni.kit.window.property",
    "omni.kit.window.stage",
    "omni.kit.window.content_browser",
    "omni.rtx.settings.core",
    "omni.kit.window.preferences",
    "omni.kit.viewport.menubar.core"

]

args = [
    "--/renderer/active='rtx'",
    "--/renderer/enabled='rtx'",
    "--/telemetry/disableInternalSessionCheck=true",
    "--reset-user",
    "--/app/file/ignoreUnsavedOnExit=true"
]
