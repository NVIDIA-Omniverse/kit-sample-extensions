[package]
title = "Omni.UI Scene Sample Object Info with Widget Example"
version = "2.0.1"  # Semantic Versioning is used: https://semver.org/
description = "This example shows a 3D object info card widget"
category = "Example"  # How to categorize this in the Extension Manager
changelog = "docs/CHANGELOG.md"
icon = "data/icon.png"  # Icon to show in the Extension Manager
keywords = ["ui", "example", "scene", "docs", "documentation", "widget"]  # Search keywords for the Extension Manager
preview_image = "data/preview.png"  # Preview to show in the Extension Manager
readme  = "docs/README.md"  # Path (relative to the root) or content of readme markdown file for UI
repository = "https://github.com/NVIDIA-Omniverse/kit-app-template"  # URL of the extension source repository


[package.writeTarget]
usd = true

[dependencies]
"omni.kit.viewport.utility" = {  }
"omni.ui.scene" = {  }
"omni.usd" = {  }


[[python.module]]  # Main python module this extension provides, it will be publicly available as "import omni.sample.ui_scene.widget_info"
name = "omni.sample.ui_scene.widget_info"


[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]


[[test]]
dependencies = [
    "omni.kit.ui_test",
    "omni.kit.hydra_texture-ovrtx",
    "omni.kit.viewport.window",
]
args = [
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/renderer/enabled=ovrtx",
    "--/renderer/active=ovrtx",
    "--no-window"
]