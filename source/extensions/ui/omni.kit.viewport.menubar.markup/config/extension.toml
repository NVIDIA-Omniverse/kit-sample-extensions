[package]
# Semantic Versioning is used: https://semver.org/
version = "104.1.26"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["Jeffrey Qiu, Jeff Hanna"]

# The title and description fields are primarly for displaying extension info in UI
title = "Markup in Viewport Menu Bar"
description="Adds a variety of markup settings"

# URL of the extension source repository.
repository="https://github.com/NVIDIA-Omniverse/kit-sample-extensions"

# Keywords for the extension
keywords = ["kit", "ui", "menu", "viewport", "markup"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

# Path (relative to the root) or content of readme markdown file for UI.
readme  = "docs/README.md"

# Icon is shown in Extensions window, it is recommended to be square, of size 256x256.
icon = "data/icon.png"
preview_image = "data/icon.png"

category = "Internal"

[dependencies]
"omni.kit.viewport.menubar.core" = {}
"omni.kit.markup.core" = {}
"omni.kit.markup.playlist" = {}

# Main python module this extension provides, it will be publicly available as "import omni.kit.viewport.menubar.display".
[[python.module]]
name = "omni.kit.viewport.menubar.markup"

[settings]
exts."omni.kit.viewport.menubar.markup".visible = true
exts."omni.kit.viewport.menubar.markup".order = 100
exts."omni.kit.markup.core".visible_startup = false

[[test]]
dependencies = [
    "omni.kit.hydra_texture-ovrtx",
    "omni.kit.viewport.window",
    "omni.kit.ui_test",
    "omni.kit.test_suite.helpers",
    "omni.kit.viewport.menubar.settings",
]

args = [
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/renderer/enabled=ovrtx",
    "--/renderer/active=ovrtx",
    "--/app/window/width=1280",
    "--/app/window/height=720",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/exts/omni.kit.viewport.window/startup/windowName=Viewport",
    "--/app/viewport/defaults/guide/grid/visible=false",
    "--/app/viewport/defaults/guide/axis/visible=false",
    "--/app/viewport/defaults/hud/visible=false",
    "--reset-user",
    "--/app/fastShutdown=1",
    "--no-window"
]

stdoutFailPatterns.exclude = [
    "*[Error] [omni.ui] _getCacheKey: local file modification time conversion failure*",
]
