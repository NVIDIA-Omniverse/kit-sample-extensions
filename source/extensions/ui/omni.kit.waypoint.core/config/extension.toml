[package]
# Semantic Versioning is used: https://semver.org/
version = "1.6.11"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["John Han", "Quan Chen"]

# The title and description fields are primarly for displaying extension info in UI
title = "Waypoint Core API"
description="extension for waypoint core APIs."

# URL of the extension source repository.
repository="https://github.com/NVIDIA-Omniverse/kit-sample-extensions"

# Keywords for the extension
keywords = ["waypoint", "core", "api"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

# Path (relative to the root) or content of readme markdown file for UI.
readme = "docs/README.md"

# Icon is shown in Extensions window, it is recommended to be square, of size 256x256.
icon = "icons/Preferences.svg"

# Preview image and icon. Folder named "data" automatically goes in git lfs (see .gitattributes file).
# Preview image is shown in "Overview" of Extensions window. Screenshot of an extension might be a good preview image.
preview_image = "icons/preview.png"

category = "Other"
display_name = "prim icon"

[package.target]
kit = ["107.3"]  # Required for Event 2.0

[package.writeTarget]
kit = true

[dependencies]
"omni.client" = {}
"omni.kit.viewport.utility" = {}
"omni.kit.prim.icon" = {}
"omni.kit.browser.core" = {}
"omni.kit.playlist.core" = {}
"omni.kit.viewport.menubar.display" = { optional=true }
"omni.kit.widget.settings" = {}
"omni.usd_presenter.sidecar" = {optional=true}
"omni.kit.actions.core" = {optional=true}
"omni.kit.hotekys.core" = {optional=true}
"omni.kit.pipapi" = {}

[python.pipapi]
requirements = ["Pillow"]
modules = ["PIL"]
use_online_index=true

# Main python module this extension provides, it will be publicly available as "import omni.kit.waypoint.core".
[[python.module]]
name = "omni.kit.waypoint.core"

[settings]
# Name of active waypoint currently being recalled.
# Empty string means that there is no active waypoint currently.
exts."omni.kit.waypoint.core".active_waypoint = ""
exts."omni.kit.waypoint.core".editing_waypoint = ""
exts."omni.kit.waypoint.core".capture.disabled_settings = "Prim Visibility"
exts."omni.kit.waypoint.core".recall.disabled_settings = "Prim Visibility"
exts."omni.kit.waypoint.core".omit_prim_visibility_feature = true
exts."omni.kit.waypoint.core".show_icons = true
exts."omni.kit.waypoint.core".list_window.save_position = true
exts."omni.kit.waypoint.core".list_window.allow_resize = true
exts."omni.kit.waypoint.core".enable_hotkeys = false

[documentation.pages]
"Overview" = "docs/overview.md"
"Settings" = "docs/SETTINGS.md"
"UsagePython" = "docs/USAGE_PYTHON.md"
"Actions" = "docs/actions_api.md"
"Changelog" = "docs/CHANGELOG.md"

[[test]]
dependencies = [
    "omni.kit.hotkeys.core",
    "omni.kit.hydra_texture-ovrtx",
    "omni.kit.viewport.window",
    "omni.kit.ui_test",
    "omni.kit.test_suite.helpers",
    # "omni.kit.debug.python"
]

args = [
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/renderer/enabled=ovrtx",
    "--/renderer/active=ovrtx",
    "--/app/window/width=800",
    "--/app/window/height=800",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/exts/omni.kit.notification_manager/disable_notifications=true",
    "--/exts/omni.kit.viewport.window/startup/windowName=Viewport",
    "--no-window",
    #"--/app/fastShutdown=1",
]
# test_extensions_api_md_is_uptodate is introduced by Kit SDK
# it will failed when this extension not enable hotkeys
pythonTests.exclude = ["*test_extensions_api_md_is_uptodate"]

stdoutFailPatterns.exclude = [
    "*[omni.usd.commands.usd_commands]  does not exist*",
    "*[Error] [omni.kit.waypoint.core.playlist_card_waypoint] [Playlist] Invalid waypoint *",
    # EA1 only (Kit 111): the published libraries refuse a custom string attribute's write (OVStage "has a different type"); every test passes. Remove when the libraries ship #2840.
    "*[omni.runtime.core]*ovstage pump_apply_usd_changes op * failed: failed to enqueue write_attributes for *: write_attributes: existing attribute '*' has a different type*",
    "*[omni.runtime.core]*ovstage pump_apply_usd_changes failed (12): *",
    "*[omni.runtime.core]*PUMP apply_usd_changes at ordinal * failed; nothing commits until the stage is repopulated past it*",
]
