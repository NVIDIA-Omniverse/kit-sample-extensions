[package]
title = "Property Window Edit API Schema"
description = "This adds a add menu item 'Edit API Schema'"
version = "1.0.4"
category = "External"
changelog = "docs/CHANGELOG.md"
preview_image = "data/preview.png"
icon = "data/icon.svg"
authors = ["Dave De Pauw"]
keywords = ['extension']
repository = "https://github.com/NVIDIA-Omniverse/kit-sample-extensions"
readme = "docs/README.md"
support_level = "Sample"

[dependencies]
"omni.kit.window.property" = {}
"omni.kit.property.usd" = {}
"omni.kit.widget.searchable_combobox" = {}

[[python.module]]
name = "omni.kit.widget.schema_api"

[[test]]
name="all"
timeout = 300
args = [
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--no-window",
]

dependencies = [
    "omni.kit.window.stage",
    "omni.kit.property.geometry",
    "omni.kit.ui_test",
    "omni.kit.test_suite.helpers",
]

stdoutFailPatterns.exclude = [
]
