[package]
authors = ["Jozef van Eenbergen"]
category = "services"
changelog = "docs/CHANGELOG.md"
description = "Run an http server (uvicorn) to serve kit microservices."
icon = "data/icon.png"
keywords = ["kit", "service", "transport", "http", "https"]
preview_image = "data/preview.png"
readme = "docs/README.md"
repository = "https://github.com/NVIDIA-Omniverse/kit-sample-extensions"
slackids = ["@U010NFP76BU"]
title = "HTTP(S) server"
version = "1.3.2"

[dependencies]
"omni.kit.pip_archive" = {}
"omni.services.core" = {}
"omni.services.transport.server.base" = {}

# Main python module this extension provides
[[python.module]]
name = "omni.services.transport.server.http"

[settings]
exts."omni.services.transport.server.http".http.enabled = true
exts."omni.services.transport.server.http".host = "0.0.0.0"
exts."omni.services.transport.server.http".port = 8011

# Server will try and bind to port, if not available and this is true it will select a random port within the 8000 to 8100 range.
exts."omni.services.transport.server.http".allow_port_range = true
exts."omni.services.transport.server.http".log_level = "error"
exts."omni.services.transport.server.http".enable_access_logs = false

# HTTPS Config
exts."omni.services.transport.server.http".https.enabled = false
exts."omni.services.transport.server.http".https.port = 8433
exts."omni.services.transport.server.http".https.host = "0.0.0.0"
exts."omni.services.transport.server.http".https.log_level = "error"
exts."omni.services.transport.server.http".https.enable_access_logs = false

# SSL Config. Only used when https is enabled.
exts."omni.services.transport.server.http".ssl.ssl_keyfile = ""
exts."omni.services.transport.server.http".ssl.ssl_certfile = ""
exts."omni.services.transport.server.http".ssl.ssl_version = -1
exts."omni.services.transport.server.http".ssl.ssl_cert_reqs = -1
exts."omni.services.transport.server.http".ssl.ssl_ca_certs = ""
exts."omni.services.transport.server.http".ssl.ssl_ciphers = "TLSv1"

# CORS Config, Only used when CORS is enabled.
exts."omni.services.transport.server.http".cors.enabled = false
exts."omni.services.transport.server.http".cors.allow_origins = []
exts."omni.services.transport.server.http".cors.allow_credentials = false
exts."omni.services.transport.server.http".cors.allow_methods = []
exts."omni.services.transport.server.http".cors.allow_headers = []

[[test]]
# Disable binding to ports when running in tests.
args = ["--/exts/omni.services.transport.server.http/http/enabled=false", "--/exts/omni.services.transport.server.http/https/enabled=false"]
