[package]
title = "Omniverse Services log facilities"
version = "2.0.2"
changelog = "docs/CHANGELOG.md"
icon = "data/icon.png"
preview_image = "data/preview.png"
readme = "docs/README.md"
description = "Omniverse Services log facilities. Easily extend a service with logging while keeping encapsulation."
detailedDescription = """
The log facility abstracts away the implementation detail of the logging system used.
By default a CarbLogFacility is available which conforms to python's logging implementation.

Other log implementations can be added and can be swapped in transparently if other logging systems are preferred
"""
category = "services"
authors = ["Jozef van Eenbergen", "Philippe Sawicki"]
repository = "https://github.com/NVIDIA-Omniverse/kit-sample-extensions"
slackids = ["@U010NFP76BU"]
keywords = ["kit", "service", "facility", "log"]
toggleable = false

[dependencies]
"omni.services.core" = {}
"omni.services.facilities.base" = {}

# Main python module this extension provides
[[python.module]]
name = "omni.services.facilities.log"

[settings.exts."omni.services.facilities.log"]
# Flag indicating whether the Correlation ID recorded as part of exchange between a server and client should be recorded
# to the log entry, or if it should be ignored and only print the provided message:
includeCorrelationIdIfAvailable = true

[[test]]
stdoutFailPatterns.exclude = [
    "*testing error message*",
    "*testing exception message*",
    "*ERROR MESSAGE*",
]
