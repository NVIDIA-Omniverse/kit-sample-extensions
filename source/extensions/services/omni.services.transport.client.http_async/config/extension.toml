[package]
authors = ["Jozef van Eenbergen", "Philippe Sawicki"]
category = "services"
changelog = "docs/CHANGELOG.md"
description = "Async HTTP(S) consumer that, when enabled, registers itself with `omni.services.client`"
icon = "data/icon.png"
keywords = ["kit", "service", "client", "http", "https"]
preview_image = "data/preview.png"
readme = "docs/README.md"
repository = "https://github.com/NVIDIA-Omniverse/kit-sample-extensions"
slackids = ["@U010NFP76BU"]
title = "Async HTTP client"
version = "1.4.2"

# Make sure this is launched early if enabled.
order = -200

[dependencies]
"omni.services.client" = {}
"omni.services.transport.client.base" = {}
"omni.kit.pip_archive" = {}

# Main python module this extension provides
[[python.module]]
name = "omni.services.transport.client.http_async"

[[python.module]]
name = "omni.services.transport.client.http_async.main"

[settings]
exts."omni.services.transport.client.https_async".https.cacert_file = ""
exts."omni.services.transport.client.https_async".https.ssl_key_file = ""
exts."omni.services.transport.client.https_async".https.ssl_pem_file = ""
exts."omni.services.transport.client.https_async".https.ssl_skip_verify = false


[[test]]
stdoutFailPatterns.exclude = [
    "*<class 'omni.kit.async_engine.async_engine._AsyncEngineDriver'>: extension object is still alive*",
]
