[package]
version = "1.0.1"
authors = ["NVIDIA"]
title = "Warp Graph"
description = "OmniGraph nodes and API using Warp"
readme  = "docs/README.md"
repository = "https://github.com/nvidia/warp"
category = "Graph"
keywords = ["computing", "cuda", "omnigraph", "simulation", "warp"]
changelog = "docs/CHANGELOG.md"
preview_image = "data/preview.png"
icon = "data/icon.png"
support_level = "Sample"

[dependencies]
"omni.graph" = {} # Responsible for registering nodes.
"omni.graph.core" = {}
"omni.graph.ui" = { optional = true }
"omni.kit.actions.core" = {}
"omni.kit.menu.utils" = { optional = true }
"omni.kit.property.usd" = { optional = true }
"omni.kit.widget.searchfield" = { optional = true }
"omni.kit.widget.text_editor" = { optional = true }
"omni.kit.window.popup_dialog" = { optional = true }
"omni.kit.window.property" = { optional = true }
"omni.timeline" = {}
"omni.ui" = { optional = true }
"omni.usd" = {}
"omni.warp.core" = {}

[[python.module]]
name = "omni.warp.graph"

# Watch the OmniGraph and Python files for hot reloading.
[fswatcher.patterns]
include = ["*.ogn", "*.py"]
exclude = ["Ogn*Database.py", "*/ogn*"]

[documentation]
pages = [
    "docs/CHANGELOG.md",
]

[[test]]
args = [
    "--/app/omni.warp.graph/kernel_node_enable=true",
]
