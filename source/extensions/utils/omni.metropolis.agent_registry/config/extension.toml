[package]
version = "0.1.4"
category = "Synthetic Data"
title = "Metropolis Sim Agent Registry"
description = "A demo helper extension for model registry"
authors = ["NVIDIA"]
repository = "https://github.com/NVIDIA-Omniverse/kit-sample-extensions"
keywords = ["metropolis","simulation", "agent registry", "metrosim", "utilities"]
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.png"
writeTarget.kit = true
writeTarget.platform = true
writeTarget.python = true

[dependencies]
"omni.ai.langchain.core" = {}
"omni.kit.widget.settings" = {}
"omni.metropolis.utils" = {}

[[python.module]]
name = "omni.metropolis.agent_registry"

[settings]

[[test]]
dependencies = [
    "omni.isaac.ml_archive",
]
args = [
    "--no-window",
    "--/windowless=1",
    "--/app/settings/fabricDefaultStageFrameHistoryCount=3",
    "--/app/file/ignoreUnsavedStage=1",
]
stdoutFailPatterns.exclude = [
    "*FutureWarning: `torch.distributed.reduce_op` is deprecated, please use `torch.distributed.ReduceOp` instead*",
    "*GLInteropContext::init: carb::windowing is not available*",

    # Intentional test error scenarios - validation failure tests expect these errors
    "*[Error] [omni.metropolis.agent_registry.registry.unified_registry] Failed to register model*",
]

[[test]]
name = "startup"
dependencies = [
    "omni.isaac.ml_archive",
]
args = [
    "--/app/settings/fabricDefaultStageFrameHistoryCount=3",
]
stdoutFailPatterns.exclude = [
    "*GLInteropContext::init: carb::windowing is not available*"
]
