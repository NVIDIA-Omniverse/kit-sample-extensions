
[package]
title = "Scene optimizer Analysis"
category = "content"
version = "110.4.1"
readme = "docs/README.md"
changelog ="docs/CHANGELOG.md"
description = "Tools for analyzing Usd stages and suggesting optimizations"
preview_image = "data/preview.png"
icon = "data/icon.png"
authors = ["NVIDIA Corporation"]
keywords = ["scene.optimizer"]

[[python.module]]
name = "omni.scene.optimizer.analysis"

[dependencies]
"omni.scene.optimizer.core" = {version = "110.4.1", exact = true}
"omni.kit.commands" = {}
"omni.client" = {}
"omni.usd" = {}

[fswatcher.patterns]
include = ["*.py"]

[[test]]
pyCoverageEnabled = true
pyCoverageIncludeModules = true
pyCoverageIncludeDependencies = false
pyCoverageIncludeTestDependencies = false
stdoutFailPatterns.exclude = [
    # Display/GL libraries in omni.usd.libs are expected to fail on headless (non-GPU) machines
    "*Could not load the dynamic library*omni.usd.libs*",
]

pyCoverageOmit = [
    "*/tests/*",
]

[[test]]
name = "startup"
stdoutFailPatterns.exclude = [
    # Display/GL libraries in omni.usd.libs are expected to fail on headless (non-GPU) machines
    "*Could not load the dynamic library*omni.usd.libs*",
]

[package.writeTarget]
kit = true
