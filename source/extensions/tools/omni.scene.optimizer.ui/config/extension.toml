
[package]
title = "Scene optimizer UI"
category = "content"
version = "110.4.1"
readme = "docs/README.md"
changelog ="docs/CHANGELOG.md"
description = "Panel for setup and execution of scene optimization operations"
preview_image = "data/preview.png"
icon = "data/icon.png"
authors = ["NVIDIA Corporation"]
keywords = ["scene.optimizer"]

[[python.module]]
name = "omni.scene.optimizer.ui"

[dependencies]
"omni.scene.optimizer.core" = {version = "110.4.1", exact = true}
"omni.kit.commands" = {}
"omni.client" = {}
"omni.ui" = {}
"omni.usd" = {}
"omni.kit.menu.utils" = {}
"omni.kit.window.filepicker" = {}
"omni.kit.widget.filebrowser" = {}
"omni.kit.widget.searchfield" = {}
"omni.kit.window.cursor" = {}

[fswatcher.patterns]
include = ["*.py"]

[[test]]
pyCoverageEnabled = true
pyCoverageIncludeModules = true
pyCoverageIncludeDependencies = false
pyCoverageIncludeTestDependencies = false

pyCoverageOmit = [
    "*/tests/*",
]

dependencies = [
	"omni.kit.ui_test"
]

[package.writeTarget]
kit = true
