
[package]
title = "Scene Optimizer Asset Validators"
category = "content"
version = "110.4.1"
readme = "docs/README.md"
changelog ="docs/CHANGELOG.md"
description = "Extension that registers Asset Validator Rule Checkers that use Scene Optimizer APIs"
preview_image = "data/preview.png"
icon = "data/icon.png"
authors = ["NVIDIA Corporation"]
keywords = ["scene.optimizer"]

[[python.module]]
name = "omni.scene.optimizer.validators"

[dependencies]
# The core ext loads the usd_optimize library and puts it on sys.path. This extension imports
# usd_optimize.validators, whose checkers use usd_optimize.core.analysis directly (so the Kit
# omni.scene.optimizer.analysis extension is not a dependency here).
"omni.scene.optimizer.core" = {version = "110.4.1", exact = true}
"omni.asset_validator.core" = {}
"omni.kit.commands" = {}
"omni.client" = {}
"omni.usd" = {}

[fswatcher.patterns]
include = ["*.py"]

[[test]]
pyCoverageEnabled = true
pyCoverageIncludeModules = true
pyCoverageIncludeDependencies = false
pyCoverageIncludeTestDependencies = false
stdoutFailPatterns.exclude = [
    # Display/GL libraries in omni.usd.libs are expected to fail on headless (non-GPU) machines
    "*Could not load the dynamic library*omni.usd.libs*",
]

pyCoverageOmit = [
    "*/tests/*",
]

[[test]]
name = "startup"
stdoutFailPatterns.exclude = [
    # Display/GL libraries in omni.usd.libs are expected to fail on headless (non-GPU) machines
    "*Could not load the dynamic library*omni.usd.libs*",
]

[package.writeTarget]
kit = true
