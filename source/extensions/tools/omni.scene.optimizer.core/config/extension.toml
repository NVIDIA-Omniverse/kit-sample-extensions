
[package]
title = "Scene Optimizer Core"
category = "content"
version = "110.4.1"
readme = "docs/README.md"
changelog ="docs/CHANGELOG.md"
description = "A suite of commands that perform scene optimization"
preview_image = "data/preview.png"
icon = "data/icon.png"
authors = ["NVIDIA Corporation"]

# Note: the core library python (the external usd_optimize package) is deployed at this extension's
# root and added to sys.path by omni/scene/optimizer/core/__init__.py. It is intentionally not
# declared as a [[python.module]] here because it is a PEP-420 namespace package.
[[python.module]]
name = "omni.scene.optimizer.core"

[dependencies]
"omni.kit.commands" = {}
"omni.usd" = {}

[fswatcher.patterns]
include = ["*.py"]

# Keywords for the extension
keywords = ["scene.optimizer"]

[[native.plugin]]
path = "bin/omni.scene.optimizer.core.plugin"
recursive = false

[[test]]
timeout = 600
pyCoverageEnabled = true
pyCoverageIncludeModules = true
pyCoverageIncludeDependencies = false
pyCoverageIncludeTestDependencies = false
stdoutFailPatterns.exclude = [
    "*[ERROR]*Incorrect padding*",
    "*[ERROR]*flattenHierarchy:*",
    "*executeErrorPythonOperation*",
    "*badExecutePythonOperation*",
    "*Runtime Error: in SdfPathExpression*",
    "*Error*scene.optimizer*Invalid Expression*",
    "*Invalid multiCluster attribute value specified*",
    # Display/GL libraries in omni.usd.libs are expected to fail on headless (non-GPU) machines
    "*Could not load the dynamic library*omni.usd.libs*",
]

pyCoverageOmit = [
    "*/tests/*",
]

[[test]]
name = "startup"
stdoutFailPatterns.exclude = [
    # Display/GL libraries in omni.usd.libs are expected to fail on headless (non-GPU) machines
    "*Could not load the dynamic library*omni.usd.libs*",
]

[package.writeTarget]
kit = true
usd = true
