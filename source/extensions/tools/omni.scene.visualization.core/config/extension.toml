[package]
title = "Scene Visualization System"
category = "Rendering"
version = "110.0.2"

icon = "data/icon.png"
preview_image = "data/icon.png"
changelog = "docs/CHANGELOG.md"
readme = "docs/index.rst"
description="Debug line/point/etc drawing interface."
authors = ["Neil Dickson, Terry Caton, Viatcheslav Telegin, Ian Bullard, Fred Hooper, Ed Quigley, Peter Shipkov"]

# URL of the extension source repository.
repository="https://github.com/NVIDIA-Omniverse/kit-sample-extensions"

# Main module for the Python interface
[[python.module]]
name = "omni.scene.visualization.core"

# Keywords for the extension
keywords = ["debugdraw"]

# Extensions required to load before this one
[dependencies]
"omni.usd" = {}
"omni.debugdraw" = {}
"omni.graph" = {}
"omni.usd.schema.scene.visualization" = {}
"usdrt.scenegraph" = {}

[[native.plugin]]
path = "bin/*.plugin"
recursive = false

# Avoid test failure due to error message in ImageProvider when renderer
# interface cannot be acquired
[[test]]
args = [
    "--/renderer/enabled=ovrtx",
    "--/renderer/active=ovrtx",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/window/hideUi=true",
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/persistent/app/viewport/displayOptions=0",
    "--/app/viewport/forceHideFps=true",
    "--/app/viewport/grid/enabled=false",
    "--/app/viewport/show/lights=false",
    "--/app/viewport/outline/enabled=false",
    "--no-window",
    # Kit 111: the -111.0 golden was recorded (1 Oct) with omni.debugdraw's Vulkan renderer in the viewport's default
    # omni.ui.scene SceneView. Kit #1512 made the retained Scene UI route the default ("sceneui"), whose line and point
    # edges are about 0.13 px thinner (mean error 0.19), and "auto" now picks the OpenGL SceneView, in which the
    # Vulkan renderer's overlay does not show (mean error 1.76). Select the recording conditions, as omni.debugdraw's
    # own image tests do.
    "--/exts/omni.debugdraw/backend=vulkan",
    "--/exts/omni.kit.viewport.window/sceneView/type=default",
]

dependencies = [
    "omni.kit.hydra_texture-ovrtx",
    "omni.kit.stage_templates",
    "omni.kit.test_helpers_gfx",
    "omni.kit.viewport.window",
    "omni.kit.viewport.utility",
    "omni.kit.test_suite.helpers"
]

[package.writeTarget]
kit = true
usd = true
