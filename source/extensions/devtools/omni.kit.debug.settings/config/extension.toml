[package]
# Semantic Versionning is used: https://semver.org/
version = "1.0.3"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["Anton Novoselov"]

# The title and description fields are primarily for displaying extension info in UI
title = "Kit Debug Settings"
description="Debug window to browse all settings."

# URL of the extension source repository.
repository="https://github.com/NVIDIA-Omniverse/kit-sample-extensions"

# One of categories for UI.
category = "Internal"

# Keywords for the extension
keywords = ["kit"]

# Path (relative to the root) or content of readme markdown file for UI.
readme  = "docs/README.md"

# https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

icon = "data/icon.png"
preview_image = "data/preview.png"

[dependencies]
"omni.kit.commands" = {}
"omni.kit.widget.settings" = {}
"omni.kit.widget.searchfield" = {}
"omni.ui" = {}

[[python.module]]
name = "omni.kit.debug.settings_window_extension"

[settings.exts]
omni.kit.debug.settings.visible_at_startup = true
omni.kit.debug.settings.visibility = true

[[test]]
name="startup"
stdoutFailPatterns.exclude = [
    "*Model widget event pump is not initialized*",
]

[documentation]
pages = ["docs/Overview.md", "docs/CHANGELOG.md", "docs/SETTINGS.md"]
