[package]
title = "Converter Common"
version = "512.0.2"
description = "Converter Common extension contains common resource and classes that can be shared among other CAD converters."

category = "Converter"
repository = "https://github.com/NVIDIA-Omniverse/kit-sample-extensions"

changelog = "docs/CHANGELOG.md"
readme = "docs/Overview.md"

preview_image = "data/preview.png"
icon = "data/icon.png"

# Explicitly set the write target so that code-less extensions are named the same as others
writeTarget.config = true
writeTarget.python = true
writeTarget.kit = true
writeTarget.usd = true
writeTarget.platform = true

authors = [
    "Mithul Panchal",
    "Chuan Hung",
    "Tim Murphy",
]

# Keywords for the extension
keywords = [
    'CAD Converter',
    'cad',
    'utilities'
]

[dependencies]
"omni.usdex.libs" = {version = "~3.0.1"}
"omni.client" = {}
"omni.scene.optimizer.core" = {}
"omni.kit.window.popup_dialog" = { optional=true }

[[python.module]]
name = "omni.kit.converter.common"

# Extension test settings
[[test]]
args = [
    "--/app/file/ignoreUnsavedOnExit=true",
    "--no-window",
    "--/app/fastShutdown=true",
]
dependencies = [
    "omni.kit.ui_test",
    "omni.kit.window.popup_dialog",
]
stdoutFailPatterns.include = []

 # Ignore errors purposely triggered in test.
stdoutFailPatterns.exclude = [
    "*Cannot copy*",
    "*Cannot read*",
    "*Cannot write*",
]

pyCoverageThreshold = 80
pyCoverageFilter = ["omni.kit.converter.common"]

pyCoverageOmit = [
    "*/tests/*",
    "*/test_utils/*",
    "omni.kit.converter.common/python/cad_core_ext_base.py", # skip coverage for core extension base class
    "omni.kit.converter.common/python/cad_ext_base.py", # skip coverage for extension base class
]

[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]
