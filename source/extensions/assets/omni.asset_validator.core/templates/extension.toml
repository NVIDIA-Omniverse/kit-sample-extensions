[package]
# Semantic Versionning is used: https://semver.org/
version = "${version}"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["Andrew Kaufman", "Miguel Hernandez"]

# The title and description fields are primarly for displaying extension info in UI
title = "Asset Validator (core)"
description="Framework for Asset Validation to ensure compliance with all Omniverse products."

# Path (relative to the root) or content of readme markdown file for UI.
readme  = "docs/extension_readme.md"

# URL of the extension source repository.
repository="https://github.com/NVIDIA-Omniverse/kit-sample-extensions"

# One of categories for UI.
category = "other"

# Keywords for the extension
keywords = ["asset", "usd", "validator", "checker"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

# Preview image and icon. Folder named "data" automatically goes in git lfs (see .gitattributes file).
# Preview image is shown in "Overview" of Extensions window. Screenshot of an extension might be a good preview image.
preview_image = "data/icons/assetValidatorActive.256x256.png"

# Icon is shown in Extensions window, it is recommended to be square, of size 256x256.
icon = "data/icons/assetValidatorActive.256x256.png"

[dependencies]
"omni.usd.libs" = {}
"omni.client" = {}
"omni.kit.pip_archive" = {}

# Omniverse implementation
[[python.module]]
name = "omni.asset_validator.core"

[[python.module]]
name = "omni.asset_validator.simready"

# Demonstrate how to add another folder to sys.path. Here we add pip packages installed at build time.
[[python.module]]
path = "pip_prebundle"

[settings]
exts."omni.asset_validator.core".enabledCategories = ["*"]
exts."omni.asset_validator.core".disabledCategories = [ "AtomicAsset", "Omni:SimReady" ]
exts."omni.asset_validator.core".enabledRules = ["*"] # expects class names for individual rules
exts."omni.asset_validator.core".disabledRules = [""]

[[test]]
pyCoverageEnabled = true
pyCoverageIncludeModules = true
pyCoverageIncludeDependencies = false
pyCoverageIncludeTestDependencies = false
pyCoverageOmit = [
    "omni/asset_validator/_impl/**", # Python package, tested outside of this extension
]
stdoutFailPatterns.include = [
    "*DeprecationWarning*",
]
