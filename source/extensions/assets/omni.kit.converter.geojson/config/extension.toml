[package]
version = "5.0.1"
title = "GeoJSON Converter (beta)"
description = "This extension converts GeoJSON data for use in Omniverse."
authors = ["Brian Dilinila"]
category = "Converter"
repository="https://github.com/NVIDIA-Omniverse/kit-sample-extensions"
readme  = "docs/README.md"
keywords = ["kit", "geojson", "converter"]
changelog = "docs/CHANGELOG.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[[python.module]]
name = "omni.kit.converter.geojson"

# Extensions required to load before this one
[dependencies]
"omni.kit.widgets.custom" = {}
"omni.ui" = {}

[[native.plugin]]
path = "bin/*.plugin"
recursive = false

# Publish extension for Kit version
[package.writeTarget]
kit = true
usd = true

[[test]]
args = [
    "--/app/file/ignoreUnsavedOnExit=true",
]

[documentation.pages]
"Overview" = "docs/overview.md"
"Changelog" = "docs/CHANGELOG.md"
"Readme" = "docs/README.md"