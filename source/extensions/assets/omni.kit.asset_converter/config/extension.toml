[package]
title = "Asset Converter"
description = "The asset converter API for converting assets. It supports conversion between assets like OBJ, GLTF, FBX and USD."

version = "6.1.5"

changelog = "docs/CHANGELOG.md"
readme  = "docs/README.md"
category = "Utility"
repository = "https://github.com/NVIDIA-Omniverse/kit-sample-extensions"

# Locks extension to the Kit version to make the extension work with that version or higher
writeTarget.kit = true

# Preview image and icon. Folder named "data" automatically goes in git lfs (see .gitattributes file).
# Preview image is shown in "Overview" of Extensions window. Screenshot of an extension might be a good preview image.
preview_image = "data/preview.png"

# Icon is shown in Extensions window, it is recommended to be square, of size 256x256.
icon = "data/icon.png"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["Roggie Zhang", "Chuan Hung"]

writeTarget.python = true
writeTarget.usd = true

support_level = "Core"

[core]
# Load at the start, load all schemas with order -100 (with order -1000 the USD libs are loaded)
order = -100
toggleable = false

[native]

[dependencies]
"omni.client" = {}
"omni.usd" = {}
"omni.mdl.neuraylib" = {}
"omni.mdl" = {}

[[python.module]]
name = "omni.kit.asset_converter"

[[python.module]]
name = "asset_converter_native_bindings"

# Extension test settings
[[test]]
stdoutFailPatterns.include = []

args = [
    "--/renderer/multiGpu/enabled=false",
    "--/renderer/multiGpu/autoEnable=false", # Disable mGPU with PXR due to OM-51026, OM-53611
    "--/renderer/multiGpu/maxGpuCount=1",
    "--/app/asyncRendering=false",
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/persistent/app/omniverse/filepicker/options_menu/show_details=false",
    "--no-window"
]

dependencies = [
    "omni.kit.viewport.window",
    "omni.kit.window.content_browser",
    "omni.kit.window.stage",
    "omni.kit.widget.layers",
    "omni.kit.quicklayout", # arranges the windows correctly
    "omni.kit.ui_test",
    "omni.kit.test_suite.helpers",
    "omni.kit.renderer.core",
    "omni.kit.renderer.capture",
    "omni.kit.uiapp",
    "omni.kit.hydra_texture-ovrtx"
]

stdoutFailPatterns.exclude = [
    "*HydraRenderer failed to render this frame*",  # Can drop a frame or two rendering with OpenGL interop
    "*Cannot use omni.hydra.pxr without OpenGL interop*", # Linux TC configs with multi-GPU might not have OpenGL available
    "*[Fatal] [omni.gpu_foundation_factory.plugin] IOMMU Enabled:*", # will report on aarch64 GPU CI runners
]

pyCoverageFilter = ["omni.kit.asset_converter"]
pyCoverageOmit = ["*/tests/*"]

[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
    "docs/Usage.md",
    "docs/Third_Party_Notices.md",
]
