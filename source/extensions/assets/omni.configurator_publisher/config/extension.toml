[package]
# Semantic Versionning is used: https://semver.org/
version = "110.0.7"

# Lists people or organizations that are considered the "authors" of the package.
authors = [
    "Christian Akesson", "Roggie Zhang",
    "Viola Lyu", "Richard Huang"
]

# The title and description fields are primarly for displaying extension info in UI
title = "Configurator Publisher"
description="The Configurator Publisher provides a fixed configurable pipeline to process chosen asset."

# Path (relative to the root) or content of readme markdown file for UI.
readme  = "docs/README.md"

# URL of the extension source repository.
repository="https://github.com/NVIDIA-Omniverse/kit-sample-extensions"

# One of categories for UI.
category = "Tool"

# Keywords for the extension
keywords = ["kit", "extension", "publisher"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

# Preview image and icon. Folder named "data" automatically goes in git lfs (see .gitattributes file).
# Preview image is shown in "Overview" of Extensions window. Screenshot of an extension might be a good preview image.
preview_image = "data/preview.png"

# Icon is shown in Extensions window, it is recommended to be square, of size 256x256.
icon = "data/icon.png"

writeTarget.kit = true

[dependencies]
"omni.client" = {}
"omni.usd" = {}
"omni.ui" = {}
"omni.kit.menu.utils" = {}
"omni.kit.window.file_importer" = {}
"omni.kit.usd.collect" = {}
"omni.scene.optimizer.core" = {}
"omni.asset_validator.core" = {}
"omni.kit.notification_manager" = {}
"omni.kit.widget.prompt" = {}
"omni.kit.pipapi" = {}

[[python.module]]
name = "omni.configurator_publisher"

[[test]]
timeout = 1200
args = [
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/app/asyncRendering=false",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/omni.kit.plugin.syncUsdLoads=true",
    "--no-window",
]
stdoutFailPatterns.exclude = ["*Failed to generate*", "*[omni_asset_validator]*", "*Failure checking rule*"]

dependencies = [
    "omni.kit.ui_test",
    "omni.kit.mainwindow",
]

[settings]
persistent.configurator_publisher.collect = true
persistent.configurator_publisher.validate = true
persistent.configurator_publisher.optimize = true
persistent.configurator_publisher.cache = true
persistent.configurator_publisher.package = true
# persistent.configurator_publisher.upload = true

# Collector
persistent.configurator_publisher.collector.ascii_to_binary = true
persistent.configurator_publisher.collector.default_prim_only = false
persistent.configurator_publisher.collector.flat_collection = false

[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]
