[package]
# Semantic Versioning is used: https://semver.org/
version = "110.0.4"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["Jihui Shentu"]

# The title and description fields are primarily for displaying extension info in UI
description = "Action Graph Node that samples curve and output data along a timeline."
title = "Timeline Action Graph Node"

# URL of the extension source repository.
repository = "https://github.com/NVIDIA-Omniverse/kit-sample-extensions"

# Keywords for the extension
keywords = ["timeline"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog = "docs/CHANGELOG.md"

# Preview image and icon. Folder named "data" automatically goes in git lfs (see .gitattributes file).
# Preview image is shown in "Overview" of Extensions window. Screenshot of an extension might be a good preview image.
icon = "data/preview.png"
preview_image = "data/preview.png"
readme = "docs/README.md"

category = "Animation"

# Main module of the python interface
[[python.module]]
name = "omni.anim.timeline"

# Additional python module used to make .ogn test files auto-discoverable
#[[python.module]]
#name = "omni.anim.timeline.tests"

# Other extensions that must be loaded before this one
[dependencies]
"omni.anim.curve.core" = {}
"omni.graph.action_core" = {}
"omni.graph.tools" = {}

[[native.plugin]]
path = "bin/*.plugin"
recursive = false

[[test]]
dependencies = [
  "omni.kit.ui_test",
  "omni.graph.action_nodes",
]

args = [
  "--no-window",
]

stdoutFailPatterns.exclude = [
  # Exclude omni.kit.stage_templates leak until it's fixed
  "*[Error]*<class 'omni.kit.stage_templates.new_stage.NewStageExtension'>: extension object is still alive*",
  "*TypeError: __init__(self, ...) called with invalid `self` argument*",
]

[package.writeTarget]
kit = true
usd = true

[deprecation]
warning = "omni.anim.timeline is deprecated as of Kit 110.4.1."
