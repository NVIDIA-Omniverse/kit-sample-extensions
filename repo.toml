########################################################################################################################
# Container Packaging Configuration
########################################################################################################################
[repo_kit_package_container]
enabled = true
gui_cli = true

# Use default container config - allows any app to be containerized without explicit config
default_container_config.enabled = true

# Build root is the release build directory
build_root = "${root}/_build/${platform}/release"

# Precache extensions when building the container
precache_extensions = true


########################################################################################################################
# NVCF (NVIDIA Cloud Functions) Deployment Configuration
########################################################################################################################
[repo_ngc]
# NGC organization for NVCF and container registry operations
org_name = "0539311403528978"  # OVC2-Development-Org

[repo_ngc.nvcf]
# Shared defaults for all Kit NVCF functions and deployments
# These are used by `repo_ngc nvcf-create` and `repo_ngc nvcf-deploy`
# CLI arguments and named configs override these settings

# Function type for streaming applications
function_type = "STREAMING"
api_body_format = "CUSTOM"

# Inference endpoint - WebRTC streaming uses port 49100
inference_url = "/sign_in"
inference_port = 49100

# Health check configuration - Kit uses omni.services.livestream.session health endpoint
health_uri = "/v1/streaming/ready"
health_port = 8011
health_protocol = "HTTP"
health_timeout = "PT10S"
health_expected_status_code = 200

# Container environment variables passed to the NVCF function at runtime
# Format: "KEY:VALUE" - override via CLI with --env "KEY:VALUE"
container_env_vars = [
    # --enable loads the extension and its streaming dependencies.
    # --merge-config applies settings at app level so they override the app's .kit defaults.
    "NVDA_KIT_NUCLEUS:apollo-swe.sample.omniverse.nvidia.com",
    "OMNI_JWT_ENABLED:1",
]

# Default deployment settings
gpu = "L40"
instance_type = "DGX-CLOUD.GPU.L40_1x"
min_instances = 1
max_instances = 1

[repo_ngc.nvcf.functions.sample-extensions-app]
# Named function configurations
# Usage: repo ngc nvcf-create --function <name>
# Or via env var: NVCF_FUNCTION=<name> repo ngc nvcf-create
# Container image should be specified via CLI or CI/CD: --container-image nvcr.io/org/image:tag
# All other settings inherited from defaults above
name = "${ngc_user}-sample-extensions-app"


[repo_ngc.nvcf.deployments.sample-extensions-app]
# Named deployment configurations
# Usage: repo ngc nvcf-deploy --deployment <name> --function-id X --version-id Y
# Or via env var: NVCF_DEPLOYMENT=<name> repo ngc nvcf-deploy --function-id X --version-id Y

# Kit devs should use Ring 1 clusters in OVC2-Development-Org
cluster = "nvcf-dgxc-k8s-forge-az27-prd1"


# Internal builds call this job; staged consumer builds invoke the script directly.

