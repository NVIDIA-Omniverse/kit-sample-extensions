    "omni.services.collect",
    "omni.services.render",
    "omni.services.transport.server.http",
    "omni.services.transport.client.http_async",
    "omni.services.facilities.monitoring.progress",
    "omni.services.usd",
    "omni.kit.debug.settings",
    "omni.kit.graph.delegate.default",
    "omni.kit.graph.delegate.modern",
    "omni.kit.graph.delegate.neo",
    "omni.kit.graph.editor.core",
    "omni.kit.graph.editor.example",
    "omni.kit.graph.widget.variables",
    "omni.kit.widget.material_preview",
    "omni.kit.converter.geojson",
    "omni.kit.language.core",
    "omni.kit.viewport.navigation.camera_manipulator",
    "omni.kit.viewport.navigation.core",
    "omni.kit.usd_explorer.render",
    "omni.kit.usd_explorer.tooltip",
]

skip_toplevel_packages."++" = [
    "warp",
]


########################################################################################################################
# Code formatting tool
########################################################################################################################

[repo_format.cpp]
# Disable C++ legal-blurb maintenance (verifying/rewriting copyright years is unusably slow, and this
# repo does not gate on it). NOTE: repo_format 3.2.x's create_legal_formatter (omni/repo/format/legal.py)
# reads `maintain_legal_blurbs` from the [repo_format.cpp] table DIRECTLY -- the older `python.`-nested
# key is silently ignored, so it defaults back to True and re-enables C++ legal verify, failing every
# source file whose copyright end-year isn't the current year. Keep this key at the cpp top level.
maintain_legal_blurbs = false
python.maintain_legal_blurbs = false
files.exclude = []

[repo_format.python]
# CI pods report the host's logical core count (128) via os.cpu_count() even though
# they are allocated only 2 CPUs, causing 128 workers to thrash on 2 cores and making
# format verification take ~10 minutes. Cap to a sensible ceiling.
job_count = 16

# repo_format 3.2.x legal-headers text files (.md/.rst/.toml/.lua/.sh/.bat/...) by DEFAULT -- a feature the
# older repo_format on `main` did not have, so NONE of this repo's text files (docs, per-extension config,
# build scripts, license files, even build.sh/build.bat) carry these headers. Enabling any text type here
# makes check-code-format demand headers that don't exist across hundreds of files. Disable text-file
# legal-blurb formatting entirely to preserve main's behavior; legal headers stay enforced on real source
# (.py via ruff/black, .cpp/.h via clang).
[repo_format.text_files]
enabled_format_types = []


