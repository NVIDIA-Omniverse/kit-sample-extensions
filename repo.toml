########################################################################################################################
# API Check tool
########################################################################################################################

[repo_checkapi]
enabled = true

[repo_checkapi.python]
exts.exclude = [
    # exclude external pip packages (should always be excluded, saves a lot of time):
    "omni.services.pip_archive",
    "omni.kit.markup.core",

    # waiting fix for omni.kit.window.extension
    "omni.kit.extensions.widget.create_extension",
    # waiting fix for omni.services.moebius's MoebiusClient
    "omni.kit.widget.cloud_share",
    "omni.kit.widget.schema_api",
    # omni.kit.markup.core include third python module (reportlab and xlsxwriter), so skip api check
    "omni.kit.waypoint.core",
    "omni.kit.tool.teleport",
    "omni.kit.window.section",

    # Vendored bindings whose generated stubs contain C++-qualified type names that are invalid Python syntax.
    "omni.usdex.libs",
    # Kit extscache extension; preloading its public module triggers a circular import in omni.kit.property.usd during checkapi.
    "omni.graph.ui*",
 ]

