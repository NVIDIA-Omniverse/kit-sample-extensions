########################################################################################################################
# Extensions precacher
########################################################################################################################

[repo_precache_exts]
# Staging uses the production registries from the matching kernel kit-core.json.
# Explicit URLs retain the existing command-scoped Storage discovery bypass.
registries = [
    { name = "kit/prod/sdk", url = "https://ovextensionsprod.blob.core.windows.net/exts/kit/prod/sdk/111.0/fdb8d7a4" },
    { name = "kit/prod/default", url = "https://ovextensionsprod.blob.core.windows.net/exts/kit/prod/111/shared" },
]
# OMPE-114910: remove these appends once all SDK pins stage the facade and runtime provider.
links.exts.include."++" = ["usdrt.scenegraph.ovstage", "usdrt.scenegraph"]

# Behavior-tree core/schema now build locally in the animation group.

# Precache extension dependencies only; the SDK still uses exts.deps.generated.kit.
apps = []

# Leave out the [exclusions] extensions; test dependencies of the tests skipped in repo_test do not exist.
kit_extra_args."++" = ["--/app/extensions/excluded=${conf:exclusions.extensions}"]
generated_app.add_test_deps = false
# Test dependencies of tests that run, which the extensions in this repo do not already pull in.
# omni.gpu_foundation.shadercache.vulkan: the tests run with app.vulkan = true (omni.kit.test's omni.app.test_ext.kit);
# on Windows omni.gpu_foundation then depends on it instead of omni.gpu_foundation.shadercache.d3d12, which the
# build itself (stubgen) uses, so the package needs both.
generated_app.default_test_deps = [
    "omni.gpu_foundation.shadercache.vulkan",
    "omni.kit.quicklayout",
    "omni.ocio",
    "omni.rtx.settings.core",
]

ext_folders = [
  "${root}/source/apps",
  "${root}/source/extensions/animation",
  "${root}/source/extensions/assets",
  "${root}/source/extensions/devtools",
  "${root}/source/extensions/deprecated",
  "${root}/source/extensions/services",
  "${root}/source/extensions/tools",
  "${root}/source/extensions/ui",
  "${root}/source/extensions/usd",
  "${root}/source/extensions/utils",
  "${root}/source/extensions/warp",
  "${root}/source/extensions/web",
]


# Precache from the package in test jobs.
[repo_kit_pull_extensions]
# Producer builds retain internal discovery; staging activates production-only delivery.
registries.internal = []
registry_default = "public"
registries.public = [
    { name = "kit/prod/sdk", url = "https://ovextensionsprod.blob.core.windows.net/exts/kit/prod/sdk/111.0/fdb8d7a4" },
    { name = "kit/prod/default", url = "https://ovextensionsprod.blob.core.windows.net/exts/kit/prod/111/shared" },
]
environment = [{ name = "staging" }]
# Leave out excluded extensions. Staging also resets inherited registry fields
# (including Storage API authentication) in the packaged tinypull command.
kit_extra_args."++" = [
    "--/app/extensions/excluded=${conf:exclusions.extensions}",
    "--/exts/omni.kit.registry.nucleus/registries=[]",
    "--/exts/omni.kit.registry.nucleus/registries/0/name=kit/prod/sdk",
    "--/exts/omni.kit.registry.nucleus/registries/0/url=https://ovextensionsprod.blob.core.windows.net/exts/kit/prod/sdk/111.0/fdb8d7a4",
    "--/exts/omni.kit.registry.nucleus/registries/0/optional=false",
    "--/exts/omni.kit.registry.nucleus/registries/1/name=kit/prod/default",
    "--/exts/omni.kit.registry.nucleus/registries/1/url=https://ovextensionsprod.blob.core.windows.net/exts/kit/prod/111/shared",
    "--/exts/omni.kit.registry.nucleus/registries/1/optional=false",
]


