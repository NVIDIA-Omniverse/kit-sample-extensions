########################################################################################################################
# Repo tool base settings
########################################################################################################################

[repo]
# Use Kit Template repo configuration as a base. Only override things specific to the repo.
import_configs = [
    # Shared config for all kit extensions repos
    "${root}/_repo/deps/repo_kit_tools/kit-template/repo.toml",
]

# Repository Name. It is used for solution name and final package name
name = "kit-sample-extensions"

# Source-owned behavior-tree header and node-manifest generators.
extra_tool_paths."++" = [
    "${root}/tools/schema",
]

[repo.tokens]
# Required to select the native asset-converter package matching this checkout's
# Kit SDK (OpenUSD 25.11 and Python 3.12).
usd_flavor = "usd"
usd_ver = "25.11"
python_ver = "3.12"
usdex_ver = "3.0"
"platform:windows-x86_64".usdex_platform = "windows_v143_x86_64"
"platform:linux-x86_64".usdex_platform = "manylinux_2_35_x86_64"
"platform:linux-aarch64".usdex_platform = "manylinux_2_35_aarch64"


########################################################################################################################
# Excluded extensions and apps
########################################################################################################################

# Extensions and apps excluded by user selection or needing something Kit 111 does not provide (missing dependency, native/OGN code that does not
# compile, or an excluded extension). Used below by premake (not built, so not packaged or tested) and by the Kit
# extension solver of the precache tools (app.extensions.excluded, so not precached). Extensions that work but whose
# tests need something missing are skipped in [repo_test.suites.alltests] exclude.
[exclusions]
extensions = [
    "omni.metropolis.agent_registry",          # needs omni.ai.langchain.core, omni.metropolis.utils
    "omni.app.web.dev",                        # needs omni.anim.curve.core, omni.graph.*, omni.physx* (not in Kit 111)
    "omni.app.particle.system",                # needs omni.graph.nodes, omni.graph.ui, omni.graph.window.*, omni.kit.manipulator.point_instancer
    "omni.app.ui.material_graph",              # app validation deferred; extension dependency restored. Also EA1: depends on omni.app.dev, which the Kit 111 EA1 kernel no longer ships (Kit #3071/#3099).
    # EA1: depends on omni.app.dev, which the Kit 111 EA1 kernel no longer ships (Kit #3071/#3099).
    "omni.app.language",
    "omni.app.ui.browser.core",
    "omni.app.ui.stage_column",
    "omni.app.usd.variant_editor",
    "omni.app.usd.sbsar",                      # app validation deferred; restored historical selection
    "omni.app.devtools.profiler",              # needs omni.kit.window.viewport (not in Kit 111)
    "omni.kit.xr.cloudxr",                     # restored source; requires unavailable Kit XR stack
]
# The authoring native bindings support x86_64 only. Omit their staging on ARM
# so the all-local-extensions precache app does not request an unsupported package.
"platform:linux-aarch64".extensions = [
    "omni.metropolis.agent_registry",
    "omni.app.web.dev",
    "omni.app.particle.system",
    "omni.app.ui.material_graph",
    "omni.app.language",
    "omni.app.ui.browser.core",
    "omni.app.ui.stage_column",
    "omni.app.usd.variant_editor",
    "omni.app.usd.sbsar",
    "omni.app.devtools.profiler",
    "omni.kit.xr.cloudxr",
]


########################################################################################################################
# Build tool setup
########################################################################################################################

[repo_build]
# Use the Visual Studio 2022 / MSVC v143 toolchain supported by Kit 111.
msbuild.vs_version = "vs2022"
msbuild.msvc_version = "v143"
# Use installed Visual Studio 2022 and Windows SDK; compiler packages are not distributed.
msbuild.link_host_toolchain = true
premake.extra_args."++" = ["--excluded-extensions=${conf:exclusions.extensions}"]

# The selected SDK publication provides release builds only.
default_build_config = ["release"]

# List of packman projects to pull (in order)
fetch.packman_target_files_to_pull = [
    "${root}/deps/kit-sdk.packman.xml",
    "${root}/deps/kit-sdk-deps.packman.xml",
    "${root}/deps/migrated-exts-deps.packman.xml",
    "${root}/deps/ui-deps.packman.xml",
    "${root}/deps/warp-build-deps.packman.xml",
    "${root}/deps/usd-optimize-deps.packman.xml",
]

# List of pip files to pip install from (in order)
fetch.pip.files_to_pull = [
    "${root}/deps/ui-pip.toml",
    "${root}/deps/migrated-exts-pip.toml",
    "${root}/deps/package-explorer-pip.toml",
    "${root}/deps/devtools-pip.toml",
    "${root}/deps/services-pip.toml",
    "${root}/deps/warp-build-pip.toml",
    "${root}/deps/asset-validator-pip.toml",
    "${root}/deps/animation-pip.toml",
]

# Build jobs may read shared pip caches but have no Packman upload credentials.
# Leave cache reads enabled and disable publishing newly installed targets.
fetch.pip.packman_remote = ""

# Use the shipped third-party notices during public source builds.
fetch.pip.licensing_enabled = false
# Public builds use the shipped notices; internal builds retain producer license gathering.
licensing.enabled = false

# Warm up the same repository Python bootstrap used by the OGN generators before parallel builds.
fetch.after_pull_commands."++" = [
    ["${root}/tools/packman/python${shell_ext}", "-c", "pass"],
]

# Run after vendor binaries are staged so extensions share the selected Kit's TBB.
pre_build.commands."++" = [
    ["${root}/_build/target-deps/python/python", "${root}/tools/build/use_kit_tbb.py", "--config", "${config}", "--platform", "${platform}"],
    [
        "${root}/_build/target-deps/python/python",
        "${root}/source/extensions/warp/omni.warp.core/build.py",
        "--pip-path", "${root}/_build/target-deps/pip_prebundle_warp_build",
        "--cuda-path", "${root}/_build/target-deps/warp_cuda",
    ],
]

# Initialize the VS installation selected by repo before Warp discovers its compiler.
# Otherwise Warp's independent vswhere -latest search can select a newer, incompatible VS.
"platform:windows-x86_64".pre_build.commands = [
    ["${root}/_build/target-deps/python/python", "${root}/tools/build/use_kit_tbb.py", "--config", "${config}", "--platform", "${platform}"],
    [
        "cmd.exe", "/d", "/c", "call",
        "${root}/_build/host-deps/msvc/VC/Auxiliary/Build/vcvars64.bat", "&&",
        "${root}/_build/target-deps/python/python.exe",
        "${root}/source/extensions/warp/omni.warp.core/build.py",
        "--pip-path", "${root}/_build/target-deps/pip_prebundle_warp_build",
        "--cuda-path", "${root}/_build/target-deps/warp_cuda",
    ],
]

# This is a cludge WAR for the lack of control repo_publish / repo_publish_exts gives in filtering files out from the packages.
# Currently, pip installed exes on windows fail code-signing as they are broken shims and do nothing.
# Invoke the standalone cleanup with the fetched build Python after the build runs.
post_build.commands."++" = [
    ["${root}/_build/target-deps/python/python", "${root}/tools/build/use_kit_tbb.py", "--config", "${config}", "--platform", "${platform}", "--check"],
    ["${root}/_build/target-deps/python/python", "${root}/tools/ci/erase_pip_exes.py", "--config", "${config}", "--platform", "${platform}"]
]

#
# PLACEHOLDER for stage_for_github


########################################################################################################################
# Test Runner
########################################################################################################################

[[repo_build.rc_file]]
file_path = "${root}/_build/scene-optimizer.rc"
product_name = "NVIDIA Omniverse Scene Optimizer"
file_Description = "NVIDIA Omniverse Scene Optimizer"

[repo_test]
default_suite = ["alltests"]

[repo_test.suites.alltests]
kind = "glob_and_exec"
path = "${test_root}"

# Ordinary CI uses alltests. Run the long Behavior Core suite explicitly with
# repo test -s behavior_core; its build/package coverage stays enabled.
[[repo_test.suites.alltests.group]]
timeout = 1800
include = [
    "tests-*${shell_ext}"
]
exclude = [
    "tests-omni.anim.behavior.core${shell_ext}", # Opt-in behavior_core suite; too costly for ordinary CI.
    # exclude all apps by default
    # note: if you develop an app that needs to be tested remove the following line
    "tests-omni.app.*${shell_ext}",
    "tests-omni.kit.xr.*${shell_ext}",           # K111-EA1-002: XR runtime qualification pending
    # These extensions work, but their tests need something Kit 111 does not provide.
    "tests-omni.kit.viewport.navigation.camera_manipulator${shell_ext}", # tests need omni.hydra.usdrt_delegate, omni.rtx.shadercache.vulkan
    "tests-omni.kit.window.material${shell_ext}",                      # tests need omni.kit.window.material_graph
    "tests-omni.usd.schema.scene.visualization${shell_ext}",           # test app omni.app.particle.system.kit needs omni.graph.nodes =2.10.0
    # EA1: needs a GPU video adapter for the WebRTC stream server; headless CI runners can't start it. Re-enable with a display-capable runner or a server-less test profile.
    "tests-omni.web.nvcf.setup${shell_ext}",
]
# A "platform:" filter replaces the list (repo_man merges filters without "++").
# ARM additionally excludes JT consumers: the toolkit has no aarch64 package.
"platform:linux-aarch64".exclude = [
    "tests-omni.anim.behavior.core${shell_ext}", # Opt-in behavior_core suite; too costly for ordinary CI.
    # exclude all apps by default
    # note: if you develop an app that needs to be tested remove the following line
    "tests-omni.app.*${shell_ext}",
    "tests-omni.kit.xr.*${shell_ext}",           # K111-EA1-002: XR runtime qualification pending
    # These extensions work, but their tests need something Kit 111 does not provide.
    "tests-omni.kit.viewport.navigation.camera_manipulator${shell_ext}", # tests need omni.hydra.usdrt_delegate, omni.rtx.shadercache.vulkan
    "tests-omni.kit.window.material${shell_ext}",                      # tests need omni.kit.window.material_graph
    "tests-omni.usd.schema.scene.visualization${shell_ext}",           # test app omni.app.particle.system.kit needs omni.graph.nodes =2.10.0
    # EA1: needs a GPU video adapter for the WebRTC stream server; headless CI runners can't start it. Re-enable with a display-capable runner or a server-less test profile.
    "tests-omni.web.nvcf.setup${shell_ext}",
    # JT toolkit is available only on Windows and Linux x86-64.
    "tests-omni.kit.converter.jt_core${shell_ext}",
    "tests-omni.kit.converter.jt${shell_ext}",
    "tests-omni.kit.converter.cad${shell_ext}",
]
args = [
    "--/exts/omni.kit.test/testExtCodeChangeAnalyzerExtSourcePaths/0='source/extensions/*/'",
    # Execute reliable and explicitly unreliable profiles; retain their separate outcomes.
    "--/exts/omni.kit.test/testExtRunUnreliableTests=2",
]

[repo_test.suites.behavior_core]
kind = "glob_and_exec"
path = "${test_root}"

[[repo_test.suites.behavior_core.group]]
include = ["tests-omni.anim.behavior.core${shell_ext}"]
# Aggregate budget for all functional groups, including startup and shutdown.
# Each child uses KSE's 1800-second limit.
timeout = 5400
# ARM CI's completed cases take 3.4-6.4 times the local Windows time. Allow the
# complete serial suite; individual functional processes still get 1800 seconds.
"platform:linux-aarch64".timeout = 14400
args = [
    "--/exts/omni.kit.test/testExtCodeChangeAnalyzerExtSourcePaths/0='source/extensions/*/'",
    "--/exts/omni.kit.test/testExtCodeChangeAnalyzerEnabled=false",
    "--/exts/omni.kit.test/testExtMaxTimeout=1800",
    "--/exts/omni.kit.test/testExtRetryStrategy=no-retry",
]

########################################################################################################################
# Benchmarks
########################################################################################################################

[repo_bench.benchmarks.extension_benchmark]
description = "Extension Benchmark"
commands = [
    [
        '${root}/repo${shell_ext}', 'test', '--from-package', '--', '--benchmark',
        '--/exts/omni.kit.test/testExtMaxParallelProcesses=1',
        '--/exts/omni.kit.test/benchmarkFingerPrint/cpu_name="${cpu_name}"',
        '--/exts/omni.kit.test/benchmarkFingerPrint/gpu_name="${gpu_name}"',
    ]
]

########################################################################################################################
# Python stubs generator
########################################################################################################################

[repo_stubgen]
# Generate stubs from the local binaries, including same-version registry duplicates.
# Appending the local folder after the template's cache folder gives it precedence.
kit_extra_args."++" = ["--ext-folder", "${root}/_build/${platform}/${config}/exts"]

# Skip extensions with no binding stubs or dependencies incompatible with stubgen.
exts_exclude = [
    # omni.anim.shared.core ships pure Python/OGN code and a native plugin, but no pybind module.
    # Stubgen discovers the native payload but therefore cannot produce any .pyi files.
    "omni.anim.shared.core",
    # Its pip bundle's charset_normalizer native modules trigger discovery but produce no stubs.
    "omni.simready.content.browser",
    # Both pull in omni.kit.usd.layers -> omni_usd_live. Live Services contributes
    # omni.usd.live from on_startup(), which stubgen's --disable-ext-startup skips.
    # Omit these targets until the SDK supports importing Live Services in that mode.
    "omni.curve.manipulator",
    "omni.wrapp.package_explorer",
]


########################################################################################################################
# Packaging
########################################################################################################################

[repo_package.packages.main_package]
# Upstream CloudXR packages without stripping: stripping libcloudxr.so breaks loading.
"linux-x86_64".files_strip_exclude = [["exts/omni.kit.xr.cloudxr/bin/*.so*"]]
"linux-aarch64".files_strip_exclude = [["exts/omni.kit.xr.cloudxr/bin/*.so*"]]
# The template strips only linux-x86_64. Unstripped aarch64 plugins carry DWARF, and a crash report then
# resolves every frame with addr2line, ~10 s per frame on the ARM test runners.
"linux-aarch64".files_strip = [
    ["**/*.so"],
]
# The excluded apps in [exclusions].
files_exclude."++" = [
    ["apps/omni.app.web.dev.kit"],
    ["apps/omni.app.particle.system.kit"],
    ["apps/omni.app.ui.material_graph.kit"],
    ["apps/omni.app.usd.sbsar.kit"],
    ["apps/omni.app.devtools.profiler.kit"],
    # EA1: depends on omni.app.dev, which the Kit 111 EA1 kernel no longer ships (Kit #3071/#3099).
    ["apps/omni.app.language.kit"],
    ["apps/omni.app.ui.browser.core.kit"],
    ["apps/omni.app.ui.stage_column.kit"],
    ["apps/omni.app.usd.variant_editor.kit"],
]


########################################################################################################################
# Extensions publisher
########################################################################################################################

[repo_publish_exts]
# Publication is managed separately from this source distribution.
enabled = false


########################################################################################################################
# Extension precache
########################################################################################################################

[repo_precache_exts]
# OMPE-114910: remove these appends once all SDK pins stage the facade and runtime provider.
links.exts.include."++" = ["usdrt.scenegraph.ovstage", "usdrt.scenegraph", "omni.runtime.core", "omni.graph.core"]

# Behavior-tree core/schema now build locally in the animation group.

# Apps to run and precache
# No app is version-locked or precached for EA1. omni.app.usd.variant_editor, the last one here, is in [exclusions]:
# EA1: depends on omni.app.dev, which the Kit 111 EA1 kernel no longer ships (Kit #3071/#3099).
apps = []

# Leave out the [exclusions] extensions; test dependencies of the tests skipped in repo_test do not exist.
kit_extra_args."++" = [
    "--/app/extensions/excluded=${conf:exclusions.extensions}",
]
generated_app.add_test_deps = false
# Test dependencies of tests that run, which the extensions in this repo do not already pull in.
# omni.gpu_foundation.shadercache.vulkan: the tests run with app.vulkan = true (omni.kit.test's omni.app.test_ext.kit);
# on Windows omni.gpu_foundation then depends on it instead of omni.gpu_foundation.shadercache.d3d12, which the
# build itself (stubgen) and the apps use, so the package needs both.
generated_app.default_test_deps = [
    "omni.gpu_foundation.shadercache.vulkan",
    "omni.kit.quicklayout",
    "omni.ocio",
    "omni.rtx.settings.core",
]

ext_folders = [
  "${root}/source/apps",
  "${root}/source/extensions/animation",
  "${root}/source/extensions/assets",
  "${root}/source/extensions/devtools",
  "${root}/source/extensions/deprecated",
  "${root}/source/extensions/physics",
  "${root}/source/extensions/services",
  "${root}/source/extensions/tools",
  "${root}/source/extensions/ui",
  "${root}/source/extensions/usd",
  "${root}/source/extensions/utils",
  "${root}/source/extensions/warp",
  "${root}/source/extensions/web",
]


# Precache from the package in test jobs.
[repo_kit_pull_extensions]
# Consumer tools require an explicit environment. Inherit registry locations from the selected Kit.
environment = [{ name = "staging" }]
registry_default = "public"
registries.internal = []
registries.public = []
kit_extra_args."++" = ["--/app/extensions/excluded=${conf:exclusions.extensions}"]  # leave out the [exclusions] extensions


