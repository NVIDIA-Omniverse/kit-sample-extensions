########################################################################################################################
# Repo tool base settings
########################################################################################################################

[repo]
# Use Kit Template repo configuration as a base. Only override things specific to the repo.
import_configs = [
    # Shared config for all kit extensions repos
    "${root}/_repo/deps/repo_kit_tools/kit-template/repo.toml",
]

# Repository Name. It is used for solution name and final package name
name = "kit-sample-extensions"

# Source-owned behavior-tree header and node-manifest generators.
extra_tool_paths."++" = [
    "${root}/tools/schema",
]

[repo.tokens]
# Only the receipt-checked Windows CI publisher overrides this token.
kit111_signed_package = "0"
# Required to select the native asset-converter package matching this checkout's
# Kit SDK (OpenUSD 25.11 and Python 3.12).
usd_flavor = "usd"
usd_ver = "25.11"
python_ver = "3.12"
usdex_ver = "3.0"
"platform:windows-x86_64".usdex_platform = "windows_v143_x86_64"
"platform:linux-x86_64".usdex_platform = "manylinux_2_35_x86_64"
"platform:linux-aarch64".usdex_platform = "manylinux_2_35_aarch64"


########################################################################################################################
# Excluded extensions
########################################################################################################################

# Extensions that need something Kit 111 does not provide (missing dependency, native/OGN code that does not
# compile, or an excluded extension). Used below by premake (not built, so not packaged or tested) and by the Kit
# extension solver of the precache tools (app.extensions.excluded, so not precached). Extensions that work but whose
# tests need something missing are skipped in [repo_test.suites.alltests] exclude.
[exclusions]
extensions = [
# Public staging omits extensions whose native packages are unavailable publicly.
    "omni.anim.curve.bundle",
    "omni.anim.curve.core",
    "omni.anim.curve.ui",
    "omni.anim.curve_editor",
    "omni.anim.timeline",
    "omni.anim.window.timeline",
    "omni.configurator_publisher",
    "omni.kit.asset_converter",
    "omni.kit.converter.common",
    "omni.kit.converter.gsplat",
    "omni.kit.tool.asset_exporter",
    "omni.kit.tool.asset_importer",
    "omni.kit.tool.measure",
    "omni.kit.viewport.navigation.measure",
    "omni.kit.viewport.navigation.usd_explorer.bundle",
    "omni.sample.minimap",
    "omni.scene.optimizer.analysis",
    "omni.scene.optimizer.bundle",
    "omni.scene.optimizer.core",
    "omni.scene.optimizer.ui",
    "omni.scene.optimizer.validators",
    "omni.services.convert.asset",
    "omni.services.starfleet.auth",
    "omni.warp.core",
    "omni.warp.graph",
# Public staging omits RTX-header consumers until their build package is public.
    "omni.anim.shared.core",
    "omni.curve.creator",
    "omni.curve.manipulator",
    "omni.genproc.bundle",
    "omni.genproc.core",
    "omni.genproc.ui",
    "omni.graph.visualization.nodes",
    "omni.kit.text3d",
    "omni.kit.window.material",
    "omni.kit.window.material_graph",
    "omni.ramp",
    "omni.scene.visualization.bundle",
    "omni.scene.visualization.core",
    "omni.scene.visualization.ui",
    # Internal support level: excluded from EA1 build, tests and precaching.
    "omni.anim.camera_tool",                   # needs omni.physx, unavailable in the selected Kit 111 registry
    "omni.entity.spawn.bundle",                # needs excluded omni.entity.spawn.core and omni.entity.spawn.ui
    "omni.entity.spawn.core",                  # needs unavailable omni.graph.io (GenProc restored)
    "omni.entity.spawn.ui",                    # needs excluded omni.entity.spawn.core
    "omni.kit.mesh.raycast",                   # native build passes; needs unavailable omni.usd.schema.physx
    "omni.metropolis.agent_registry",          # needs omni.ai.langchain.core, omni.metropolis.utils
    "omni.kit.graph.docs",                     # skipped by decision: needs omni.kit.documentation.builder
]


########################################################################################################################
# Build tool setup
########################################################################################################################

[repo_build]
# Match Kit 111's MSVC 14.3x toolchain and the passing Windows setup in PR #152.
msbuild.vs_version = "vs2022"
msbuild.msvc_version = "v143"
# Public Windows builds use the locally installed Visual Studio and Windows SDK.
msbuild.link_host_toolchain = true
premake.extra_args."++" = ["--excluded-extensions=${conf:exclusions.extensions}"]

# The published producer currently delivers release kernels, not debug.
default_build_config = ["release"]

# List of packman projects to pull (in order)
fetch.packman_target_files_to_pull = [
    "${root}/deps/kit-sdk.packman.xml",
    "${root}/deps/kit-sdk-deps.packman.xml",
    "${root}/deps/migrated-exts-deps.packman.xml",
    "${root}/deps/assets-deps.packman.xml",
    "${root}/deps/ui-deps.packman.xml",
    "${root}/deps/particle-deps.packman.xml",
    "${root}/deps/animation-deps.packman.xml",
]

# List of pip files to pip install from (in order)
fetch.pip.files_to_pull = [
    "${root}/deps/ui-pip.toml",
    "${root}/deps/migrated-exts-pip.toml",
    "${root}/deps/package-explorer-pip.toml",
    "${root}/deps/services-pip.toml",
    "${root}/deps/asset-validator-pip.toml",
    "${root}/deps/animation-pip.toml",
]

# Skip repo_build's pip license-text aggregation. On a fresh cache build (forced by the repo_build
# upgrade producing new cache hashes), gather_pip_licenses fatally fails on neptune-metrics==1.0.0
# embeddable LICENSE file (only `License: NVIDIA` metadata, which repo_licensing does not read).
# This is a first-party packaging gap, not a third-party compliance risk; each dependency's legal
# review is tracked via SWIPAT/OSRB and every third-party wheel still carries its embedded license.
fetch.pip.licensing_enabled = false

# Warmup/bootstrap kit's python before building. OG calls it in parallel in build process which is known to randomly fail the bootstrap.
fetch.after_pull_commands."++" = [
    ["${root}/_build/${platform}/${config}/kit/dev/tools/packman/python${shell_ext}"],
]

pre_build.commands."++" = [

]

# This is a cludge WAR for the lack of control repo_publish / repo_publish_exts gives in filtering files out from the packages.
# Currently, pip installed exes on windows fail code-signing as they are broken shims and do nothing.
# This invokes a small job using the repo_ci definition just below it to glob and erase these after the build runs.
post_build.commands."++" = [
    ["${root}/_build/target-deps/python/python", "${root}/tools/ci/erase_pip_exes.py", "--config", "${config}", "--platform", "${platform}"]
]
# License gathering remains in internal release preparation; public builds use shipped notices.
licensing.enabled = false



########################################################################################################################
# Test Runner
########################################################################################################################

[[repo_build.rc_file]]
file_path = "${root}/_build/scene-optimizer.rc"
product_name = "NVIDIA Omniverse Scene Optimizer"
file_Description = "NVIDIA Omniverse Scene Optimizer"

[repo_test]
default_suite = ["alltests"]

[repo_test.suites.alltests]
kind = "glob_and_exec"
path = "${test_root}"

# Run all test
include = [
    "tests-*${shell_ext}"
]
exclude = [
    # Extensions-only release: never select project app launchers.
    "tests-omni.app.*${shell_ext}",
    # These extensions work, but their tests need something Kit 111 does not provide.
    "tests-omni.kit.viewport.navigation.camera_manipulator${shell_ext}", # tests need omni.hydra.usdrt_delegate, omni.rtx.shadercache.vulkan
    "tests-omni.kit.window.movie_capture${shell_ext}",                 # tests need omni.kit.environment.sunstudy, omni.rtx.tests
    "tests-omni.usd.schema.scene.visualization${shell_ext}",           # standard SDK harness needs qualification after retiring the particle app; previously solver exit 55
    # The test dependencies of these two do not exist for Kit 111 in CI's registries (solver exit 55). The fleet's pods
    # run them with source-built OmniGraph/animation payload folders and the 110 prod registries, so they keep coverage there.
    # EA1: needs a GPU video adapter for the WebRTC stream server; headless CI runners can't start it. Re-enable with a display-capable runner or a server-less test profile.
]
# A "platform:" filter replaces the list (repo_man merges filters without "++").
# The ARM and default exclusions now match after retiring the JT converters.
"platform:linux-aarch64".exclude = [
    # Extensions-only release: never select project app launchers.
    "tests-omni.app.*${shell_ext}",
    # These extensions work, but their tests need something Kit 111 does not provide.
    "tests-omni.kit.viewport.navigation.camera_manipulator${shell_ext}", # tests need omni.hydra.usdrt_delegate, omni.rtx.shadercache.vulkan
    "tests-omni.kit.window.movie_capture${shell_ext}",                 # tests need omni.kit.environment.sunstudy, omni.rtx.tests
    "tests-omni.usd.schema.scene.visualization${shell_ext}",           # standard SDK harness needs qualification after retiring the particle app; previously solver exit 55
    # The test dependencies of these two do not exist for Kit 111 in CI's registries (solver exit 55). The fleet's pods
    # run them with source-built OmniGraph/animation payload folders and the 110 prod registries, so they keep coverage there.
    # EA1: needs a GPU video adapter for the WebRTC stream server; headless CI runners can't start it. Re-enable with a display-capable runner or a server-less test profile.
]
args = [
    "--/exts/omni.kit.test/testExtCodeChangeAnalyzerExtSourcePaths/0='source/extensions/*/'",
]

########################################################################################################################
# Benchmarks
########################################################################################################################

[repo_stubgen]
# These extensions contain no first-party pybind modules. Their pip bundles include
# charset_normalizer native modules, which trigger stubgen discovery but produce no stubs.
exts_exclude = [
    # Stubgen discovers the native payload but therefore cannot produce any .pyi files.
    "omni.simready.content.browser",
]


########################################################################################################################
# Packaging
########################################################################################################################

[repo_package.packages.main_package]
# The template strips only linux-x86_64. Unstripped aarch64 plugins carry DWARF, and a crash report then
# resolves every frame with addr2line, ~10 s per frame on the ARM test runners.
"linux-aarch64".files_strip = [
    ["**/*.so"],
]
# Ship extension dependency metadata, never project applications (including stale local output).
files_exclude."++" = [
    ["apps/omni.app.*.kit"],
    ["omni.app.*${shell_ext}"],
    ["tests-omni.app.*${shell_ext}"],
]


########################################################################################################################
# Extensions publisher
########################################################################################################################

[repo_publish_exts]
# CI signs and verifies Windows packages with the shared Azure actions before publishing.
# Match Kit: publish the already-signed bytes without invoking legacy repo_codesign.
signing.enabled = false
# Azure signing runs externally; retain the publisher metadata expected by public registry checks.
"platform:windows-x86_64".kit_extra_args."++" = ["--/app/extensions/publishExtraDict/package/publish/signed=${kit111_signed_package}"]

repo_name = "kit-sample-extensions"
registries = [
